<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>深渊回廊 · 3.0 竖塔壳验证台</title>
<style>
  body { margin:0; background:#0a0e18; color:#e8eefc; font-family:"Microsoft YaHei",system-ui,sans-serif; }
  #stage { position:fixed; inset:0; }
  #panel { position:fixed; left:12px; top:12px; z-index:10; max-width:760px; max-height:92vh; overflow:auto;
    background:rgba(15,22,44,.94); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.65; }
  h1 { font-size:15px; margin:0 0 8px; color:#f0d06a; letter-spacing:.05em; }
  .ok { color:#73f0b4; } .bad { color:#ff5d7a; } .dim { color:#90a2c8; }
  pre { margin:0; white-space:pre-wrap; }
  button { margin-top:8px; padding:6px 12px; border-radius:6px; border:1px solid rgba(115,240,180,.4);
    background:rgba(115,240,180,.12); color:#73f0b4; cursor:pointer; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="panel">
  <h1>3.0 · 批5 竖塔坐标系壳</h1>
  <div class="dim">覆盖：一屏宽 / 层数 / 220 层距 / 楼板可穿 / 两面墙 / 纵向相机 / 键位拆分（S 防御 · ↓ 穿一层）/ 一次一层 / 能爬回去。</div>
  <button id="rerun">重新跑一遍</button>
  <pre id="out">准备中…</pre>
</div>
<script src="../vendor/phaser.min.js?v=20261031-30"></script>
<script src="../角色形象.js?v=20261031-30"></script>
<script src="../战斗2D.js?v=20261031-30"></script>
<script>
(function () {
  var out = document.getElementById('out'), lines = [], pass = 0, fail = 0;
  function log(s, cls) { lines.push(cls ? '<span class="' + cls + '">' + s + '</span>' : s); out.innerHTML = lines.join('\n'); }
  function section(t) { lines.push(''); log('── ' + t + ' ──', 'dim'); }
  function assert(c, msg, extra) { if (c) { pass++; log('  ✓ ' + msg, 'ok'); } else { fail++; log('  ✗ ' + msg + (extra != null ? '  → ' + extra : ''), 'bad'); } }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var A = window.战斗2D, scn = null;

  async function boot() {
    if (!A.debug().ready) {
      if (!A.debug().booted) { A.init(document.getElementById('stage'), true); A.show(); }
      await sleep(400);
    }
    A.setGodMode(true);
    A.startRun({
      heroName: '塔测', points: 0, player: { maxHp: 500, hp: 500, attack: 12, dodge: 0 },
      difficulty: 'normal', heroId: 'warrior', skill: { id: 'warrior' }, curses: [], environment: null
    });
    await sleep(500);
    scn = A.getGame().scene.getScene('TrialBattle');
  }

  async function tapDown(holdMs) {
    scn.keys.guard2.isDown = true;
    await sleep(holdMs || 70);
    scn.keys.guard2.isDown = false;
  }

  async function run() {
    lines = []; pass = 0; fail = 0;
    A = window.战斗2D;
    log('引擎: ' + (A ? '已加载' : '未加载'), A ? 'ok' : 'bad');
    if (!A) return;
    await boot();
    if (!scn) { log('场景未就绪', 'bad'); return; }

    /* ---------- 1. 坐标系 ---------- */
    section('1. 把房间转 90°（宽度锁一屏 / 长度搬到 y 轴）');
    A.buildTowerRoom({ type: 'enemy' });
    await sleep(400);
    var d = A.debug(), t = d.tower;
    assert(!!t, '竖塔已建成');
    if (!t) return;
    assert(t.levelWidth === t.viewW, '房间宽 = 一屏（横向完全不滚）', t.levelWidth + ' / ' + t.viewW);
    assert(t.steps === 7, '第 1 层 → 7 层（round(1490/220)）', t.steps);
    assert(t.steps === Math.round(t.roomDepth / t.step), '层数 = round(roomDepth / step)',
      t.steps + ' vs ' + Math.round(t.roomDepth / t.step));
    assert(t.decks.length === t.steps - 1, '楼板数 = 层数 − 1（第 N 层是井底地面）', t.decks.length);
    assert(t.decks[0].y === t.topPad, '第 1 层楼板 y = topPad（顶部留白）', t.decks[0].y);
    assert(t.decks[1].y - t.decks[0].y === t.step, '层距 = 220', t.decks[1].y - t.decks[0].y);
    assert(Math.abs(t.groundY - (t.topPad + (t.steps - 1) * t.step)) <= 1,
      '井底 = topPad + (N−1)×220', t.groundY);
    assert(t.walls === 2, '左右两面墙', t.walls);

    /* ---------- 2. 楼板可穿 / 墙不可穿 ---------- */
    section('2. 楼板必须可穿（否则"按 ↓ 下一层"整个不成立）');
    var deckTile = null, wallTile = null;
    scn.platformTiles.forEach(function (tt) {
      if (!deckTile && tt._towerDeck) deckTile = tt;
      if (!wallTile && tt._towerWall) wallTile = tt;
    });
    assert(!!deckTile, '有楼板碰撞体');
    assert(deckTile && !deckTile._solidDeck, '楼板是单向薄板（不是实体楼板）');
    assert(!!wallTile, '有墙体碰撞体');
    assert(wallTile && wallTile._solidDeck === true, '墙标记为不可穿');
    // 直接验穿透开关确实作用到楼板。
    // ⚠️ 同步执行、中间不 await：引擎每帧都会按"穿层窗口 / 加速下坠"重新裁决穿透状态，
    //    等一帧再读就会被 updateHero 改回去（那不是 bug，是设计）。
    scn.setPlatformPassThrough(true);
    assert(deckTile.body.checkCollision.up === false, '开穿透 → 楼板 up 面关闭');
    scn.setPlatformPassThrough(false);
    assert(deckTile.body.checkCollision.up === true, '关穿透 → 楼板 up 面恢复');
    assert(wallTile.body.checkCollision.up === true, '墙不受穿透开关影响');

    /* ---------- 3. 相机 ---------- */
    section('3. 相机：横向锁定 + 纵向跟随');
    assert(A.debug().tower.scrollX === 0, 'scrollX 恒为 0', A.debug().tower.scrollX);
    // 把主角搬到房间最右端：横向依然不该滚
    scn.hero.body.reset(t.levelWidth - 30, scn.hero.y);
    await sleep(150);
    assert(A.debug().tower.scrollX === 0, '走到右边缘 scrollX 仍为 0', A.debug().tower.scrollX);
    var cb = A.debug().tower.camBounds;
    assert(cb.y === 0, '相机下边界从 0 开始（不留 −head 余量）', cb.y);
    assert(cb.h >= t.groundY, '相机上边界覆盖整个井深', cb.h + ' vs ' + t.groundY);
    // 从顶部滚到底部：scrollY 必须真的变化
    scn.hero.body.reset(140, t.topPad - 80);
    await sleep(400);
    var topScroll = A.debug().tower.scrollY;
    scn.hero.body.reset(140, t.groundY - 5);
    await sleep(700);
    var bottomScroll = A.debug().tower.scrollY;
    assert(bottomScroll > topScroll + 400, '井底比顶部滚得深（纵向跟随）', topScroll + ' → ' + bottomScroll);

    /* ---------- 4. 进房点 ---------- */
    section('4. 进房点：房间顶部左侧');
    A.buildTowerRoom({ type: 'enemy' });
    await sleep(400);
    var hy = A.debug().hero.y;
    // 站立位置 = 薄板的**视觉顶面**（y − 10），不是碰撞体中心
    assert(Math.abs(hy - (t.topPad - 10)) <= 8, '出生站在第 1 层楼板上（y ≈ 190）', hy);
    assert(A.debug().tower.scrollY <= 4, '开局镜头在顶部', A.debug().tower.scrollY);

    /* ---------- 5. 键位拆分 ---------- */
    section('5. 键位拆分：S 防御 · ↓ 穿层（不再共用）');
    scn.touchInput.guardHeld = true;
    await sleep(140);
    assert(scn.guarding === true, 'S / 触摸防御按钮 → 举盾');
    scn.touchInput.guardHeld = false;
    await sleep(160);
    assert(scn.guarding === false, '松手收盾');
    var yBefore = A.debug().hero.y;
    scn.keys.guard2.isDown = true;
    await sleep(140);
    assert(scn.guarding === false, '↓ 不再举盾（拆开成功）', scn.guarding);
    scn.keys.guard2.isDown = false;
    await sleep(700);
    var yAfterOne = A.debug().hero.y;
    assert(Math.abs(yAfterOne - (yBefore + 220)) <= 14, '按一次 ↓ 下一层（+220）',
      yBefore + ' → ' + yAfterOne);

    /* ---------- 6. 一次只下一层 ---------- */
    section('6. 一次只下一层（设计红线）');
    var y2 = A.debug().hero.y;
    scn.keys.guard2.isDown = true;
    await sleep(1000);              // 按住 1 秒
    var y3 = A.debug().hero.y;
    scn.keys.guard2.isDown = false;
    await sleep(800);
    assert(Math.abs(y3 - (y2 + 220)) <= 14, '按住 ↓ 1 秒也只下一层', y2 + ' → ' + y3);

    var y4 = A.debug().hero.y;
    scn.hero.setVelocityY(-1150);   // 模拟满蓄力跳（跳高 389px）
    await sleep(160);
    scn.keys.guard2.isDown = true;
    await sleep(1300);              // 空中按住 ↓（加速下坠）
    scn.keys.guard2.isDown = false;
    await sleep(500);
    var y5 = A.debug().hero.y;
    assert(Math.abs(y5 - y4) <= 14, '空中按 ↓ 只加速下坠、不穿层（落回同一层）', y4 + ' → ' + y5);

    /* ---------- 7. 连续 N 次 = N 层 ---------- */
    section('7. 按 N 次正好下 N 层');
    A.buildTowerRoom({ type: 'enemy' });
    await sleep(400);
    var startY = A.debug().hero.y;
    for (var i = 0; i < 3; i++) {
      await tapDown(70);
      await sleep(760);
    }
    var endY = A.debug().hero.y;
    assert(Math.abs(endY - (startY + 3 * 220)) <= 16, '连按 3 次 ↓ = 下 3 层（660px，0 误差）',
      startY + ' → ' + endY + '（差 ' + (endY - startY) + '）');

    /* ---------- 8. 能爬回去 ---------- */
    section('8. 从井底一层层跳回顶部（能回头补漏的前提）');
    A.buildTowerRoom({ type: 'enemy' });
    await sleep(400);
    var tt2 = A.debug().tower;
    scn.hero.body.reset(140, tt2.groundY - 5);
    await sleep(500);
    var yBottom = A.debug().hero.y;
    assert(Math.abs(yBottom - tt2.groundY) <= 8, '落在井底', yBottom + ' / ' + tt2.groundY);
    scn.hero.setVelocityY(-1150);
    await sleep(1500);
    var yUp = A.debug().hero.y;
    var want = tt2.groundY - tt2.step;
    assert(Math.abs(yUp - want) <= 16, '满蓄力 389 > 220 → 跳回上一层', yUp + ' vs ' + want);

    /* ---------- 9. 不波及平厅 ---------- */
    section('9. 不波及：非竖塔房间一切照旧');
    scn._forceSkeleton = null;
    scn.buildLevel({ type: 'enemy', col: 0, row: 1 });
    await sleep(500);
    var dNone = A.debug();
    assert(!dNone.tower, '平厅的 tower 状态为空');
    assert(dNone.hero.onGround || dNone.hero.y > 0, '平厅里主角正常落地');
    assert(dNone.terrain.groundSegments.length > 0, '平厅地面分段仍在');
    assert(dNone.skeleton.room !== 'vertical', '平厅骨架不是 vertical', dNone.skeleton.room);

    section('10. 批6 · 敌人沿 y 分布 / 魂晶在楼板上 / 出口在底部右端');
    A.buildTowerRoom({ type: 'enemy' });
    await sleep(700);
    var d6 = A.debug().tower;
    var alive = d6.enemies || [];
    var nonFly = alive.filter(function (e) { return !e.fly; });
    assert(alive.length >= 4, '塔里有敌人', alive.length);
    var levels = {};
    var onDeck = 0;
    nonFly.forEach(function (e) {
      if (d6.decks.some(function (dk) { return Math.abs(e.y - dk.y) <= 60; })) onDeck++;
      if (e.level) levels[e.level] = (levels[e.level] || 0) + 1;
    });
    assert(onDeck >= Math.min(3, nonFly.length), '多数敌人站在各自的楼板上（不是全落井底）',
      onDeck + '/' + nonFly.length);
    var covered = Object.keys(levels).length;
    assert(covered >= d6.decks.length - 1, '几乎每层都有怪（井底留给汇合）',
      covered + '/' + d6.decks.length);
    var ys = nonFly.map(function (e) { return e.y; });
    assert(Math.max.apply(null, ys) - Math.min.apply(null, ys) > 400, '敌人纵向分布在不同深度',
      Math.min.apply(null, ys) + ' ~ ' + Math.max.apply(null, ys));
    assert(!levels[d6.steps], '井底层不放怪（留给汇合决战）', JSON.stringify(levels));

    var cr = d6.crystals || [];
    assert(cr.length >= 1, '有魂晶', cr.length);
    var crOnDeck = cr.filter(function (c) {
      return d6.decks.some(function (dk) { return Math.abs(c.y - (dk.y - 46)) <= 14; });
    }).length;
    assert(crOnDeck === cr.length, '魂晶全部落在楼板顶面上（不悬空）', crOnDeck + '/' + cr.length);

    assert(!!d6.portal, '有传送门');
    assert(Math.abs(d6.portal.x - (d6.levelWidth - 100)) <= 2, '出口在房间右端', d6.portal.x);
    assert(Math.abs(d6.portal.y - (d6.groundY - 45)) <= 2, '出口在井底（底部右端）', d6.portal.y);

    section('10b. 批6 · 掉落回传按 y 找最近楼板');
    var t6 = A.debug().tower;
    var midDeck = t6.decks[Math.floor(t6.decks.length / 2)];
    // 纯函数语义：任意 y → 最近的一层（横厅是"缺口右侧"，竖塔是"最近的一层楼板"）
    assert(Math.abs(scn.nearestTowerDeckY(midDeck.y + 40) - midDeck.y) <= 1,
      '落在某层下方 40px → 最近的就是这层', scn.nearestTowerDeckY(midDeck.y + 40) + ' vs ' + midDeck.y);
    assert(scn.nearestTowerDeckY(t6.groundY + 300) === t6.groundY, '井底以下的 y → 井底');
    // 真实路径：掉出井底（PIT.triggerY=220）→ 扣血 + 回到最近的楼板（这里就是井底）
    scn._pitLockUntil = 0; scn.invulnUntil = 0;
    scn.hero.hp = scn.hero.maxHp;
    var hpBefore = scn.hero.hp;
    scn.hero.body.reset(300, t6.groundY + 400);
    await sleep(500);
    var yResp = A.debug().hero.y;
    assert(Math.abs(yResp - t6.groundY) <= 14, '掉出井底 → 传送回井底地面', yResp);
    assert(A.debug().hero.hp < hpBefore, '坠落要扣血', hpBefore + ' → ' + A.debug().hero.hp);

    section('12. 批7 · 敌人穿层追击');
    A.buildTowerRoom({ type: 'enemy' });
    await sleep(800);
    var t7 = A.debug().tower;
    var ground = (t7.enemies || []).filter(function (e) { return !e.fly; });
    assert(ground.length >= 2, '塔里有地面怪', ground.length);
    // 取"最上面那一层"的一只怪，记下它的 id 与 y
    ground.sort(function (a, b) { return a.y - b.y; });
    var target = ground[0];
    var targetY0 = target.y;
    // 把玩家放到它下面两层
    scn.hero.body.reset(target.x, targetY0 + 460);
    await sleep(250);
    var droppedY = null;
    for (var qi = 0; qi < 14; qi++) {
      await sleep(240);
      var list = A.debug().tower.enemies || [];
      var cur = null;
      for (var ci = 0; ci < list.length; ci++) { if (list[ci].id === target.id) { cur = list[ci]; break; } }
      if (cur && cur.y > targetY0 + 150) { droppedY = cur.y; break; }
    }
    assert(droppedY !== null, '玩家在下方 → 上层近战怪 3s 内开始穿层追',
      droppedY === null ? ('仍是 ' + targetY0) : (targetY0 + ' → ' + droppedY));

    section('12b. 追击不堆叠 / 回退开关');
    // 等一会儿，统计井底附近（最下 2 层）同时有几只
    await sleep(2200);
    var bottom = A.debug().tower;
    var nearBottom = (bottom.enemies || []).filter(function (e) {
      return !e.fly && e.y > bottom.groundY - 2 * bottom.step - 60;
    }).length;
    assert(nearBottom <= 4, '井底不会同时堆 4 只以上（冷却 1.2s 错开落地）', nearBottom);
    var opts = A.setTowerOptions({ enemyChase: false });
    assert(opts.enemyChase === false, '回退开关 towerEnemyChase=false 生效', JSON.stringify(opts));
    A.setTowerOptions({ enemyChase: true });

    section('12c. 飞行怪：无视楼板但仍受边界');
    A.buildTowerRoom({ type: 'enemy' });
    await sleep(600);
    var tFly = A.debug().tower;
    // 不靠随机抽到飞行怪：手动放一只（影），测完清掉
    var flyE = scn.spawnEnemy('shade', Math.round(tFly.levelWidth * 0.5), tFly.decks[2].y, scn.floor);
    assert(!!flyE, '放了一只飞行怪');
    await sleep(300);
    assert(flyE.sprite.body.checkCollision.none === true, '飞行怪不与地形碰撞（无视楼板）');
    assert(flyE.sprite.body.allowGravity === false, '飞行怪不受重力');
    // 把它推到房间右侧外面：边界 + 兜底必须把它留在场内（或判离场），不能凭空飞出世界
    flyE.sprite.body.reset(tFly.levelWidth + 60, tFly.decks[2].y - 40);
    await sleep(500);
    var inBounds = (flyE.alive ? (flyE.sprite.x <= tFly.levelWidth + 200) : true);
    assert(inBounds, '飞行怪被世界边界约束（没飞出房间）',
      flyE.alive ? Math.round(flyE.sprite.x) + ' / ' + tFly.levelWidth : '已判离场');
    if (flyE.alive) { try { scn.dropEnemy(flyE); } catch (e) {} }

    section('12d. 远程怪弹丸能穿 1 层楼板');
    A.buildTowerRoom({ type: 'enemy' });
    await sleep(600);
    var tP = A.debug().tower;
    var shE = scn.spawnEnemy('necro', Math.round(tP.levelWidth * 0.5), tP.decks[1].y, scn.floor);
    assert(!!shE, '放了一只远程怪（死灵法师）');
    await sleep(250);
    // 玩家放到它正下方两层
    scn.hero.body.reset(shE.sprite.x, tP.decks[3].y - 40);
    await sleep(200);
    var shot0 = scn.projectiles.length;
    shE.atk = 8;
    scn.enemyShoot(shE);
    await sleep(60);
    var shot = scn.projectiles[scn.projectiles.length - 1];
    assert(!!shot && scn.projectiles.length > shot0, '射出了一发');
    assert(shot && shot._pierceFloors === 1, '竖塔里的敌方弹丸带 pierceFloors=1',
      shot ? shot._pierceFloors : null);
    // 让它自己飞：弹丸应从上层穿过一层楼板、落到下层（而不是一出膛就插在自家楼板上）
    if (shot) {
      var y0 = shot.y;
      await sleep(900);
      if (shot.active) {
        assert(shot.y > y0 + 100, '弹丸穿过了它自己那层楼板（继续往下飞）',
          Math.round(y0) + ' → ' + Math.round(shot.y));
      } else {
        assert(shot._pierceFloors === 0 || shot._grounded, '弹丸已消耗 / 已插住（不是无解地穿）',
          'pierce=' + shot._pierceFloors);
      }
    }
    // 横厅里不带穿层（回归：不波及）
    scn._verticalRoom = false;
    var plain = scn.spawnEnemy('necro', 300, scn.groundY - 40, scn.floor);
    if (plain) { assert(scn.pierceFloorsFor(plain) === 0, '横厅弹丸不穿层', scn.pierceFloorsFor(plain)); try { scn.dropEnemy(plain); } catch (e) {} }
    scn._verticalRoom = true;

    section('13. 批8 · 陷阱投放密度（先掷有没有 → 再掷几个）');
    var layers = 0, noneN = 0, singleN = 0, dblN = 0, bottomTrap = 0;
    for (var ti = 0; ti < 18; ti++) {
      A.buildTowerRoom({ type: 'enemy' });
      await sleep(230);
      var tt = A.debug().tower;
      var byLevel = {};
      (tt.traps || []).forEach(function (t) { byLevel[t.level] = (byLevel[t.level] || 0) + 1; });
      for (var lv = 1; lv <= tt.steps - 1; lv++) {
        layers++;
        var c = byLevel[lv] || 0;
        if (c === 0) noneN++; else if (c === 1) singleN++; else dblN++;
      }
      if (byLevel[tt.steps]) bottomTrap++;   // 井底层不该有陷阱
    }
    var pct = function (n) { return Math.round(n / layers * 100); };
    log('  抽样：' + layers + ' 层 · 无 ' + pct(noneN) + '% / 单 ' + pct(singleN) + '% / 双 ' + pct(dblN) + '%', 'dim');
    assert(pct(noneN) >= 28 && pct(noneN) <= 52, '无陷阱 ≈ 40%', pct(noneN) + '%');
    assert(pct(singleN) >= 36 && pct(singleN) <= 60, '单个 ≈ 48%', pct(singleN) + '%');
    assert(pct(dblN) <= 22, '两个 ≈ 12%（不超过 22%）', pct(dblN) + '%');
    assert(dblN <= layers * 0.3, '同层最多 2 个', dblN);
    assert(bottomTrap === 0, '井底层从不放陷阱', bottomTrap);

    section('14. 穿刺：停留 0.6s → 0.25s 预警 → 伤害');
    A.setGodMode(false);
    A.buildTowerRoom({ type: 'enemy' });
    await sleep(400);
    scn.clearTraps();
    var dSpike = A.debug().tower.decks[1];
    var sp = scn.spawnTrap('spike', { level: dSpike.level, y: dSpike.y });
    sp.x = 300;
    scn.hero.hp = scn.hero.maxHp;
    scn.hero.shield = 0;                 // 护盾会先抵扣伤害，这里要验的是"真的掉了血"
    scn.invulnUntil = 0; scn._pitLockUntil = 0;
    scn.hero.body.reset(300, dSpike.y - 10);
    await sleep(150);
    assert(sp.state === 'idle', '刚站上去不立刻触发（要停留）', sp.state);
    await sleep(500);
    assert(sp.state === 'warn', '停留够 0.6s → 进入预警', sp.state);
    var hpBeforeSpike = scn.hero.hp;
    await sleep(400);
    assert(scn.hero.hp < hpBeforeSpike, '0.25s 后刺出并造成伤害', hpBeforeSpike + ' → ' + Math.round(scn.hero.hp));
    assert(sp.state === 'cool', '触发后进入冷却', sp.state);
    // 护盾优先抵扣（引擎既有规则，这里只是确认陷阱走的是同一条伤害出口）
    scn.hero.hp = scn.hero.maxHp; scn.hero.shield = 30;
    scn.invulnUntil = 0;
    scn.hero.body.reset(300, dSpike.y - 10);      // 上一条把玩家击退了，先站位回陷阱上
    var spShield = scn.spawnTrap('spike', { level: dSpike.level, y: dSpike.y });
    spShield.x = 300; spShield.state = 'idle'; spShield.stayMs = 999;
    var shBefore = scn.hero.shield;
    scn.fireTrap(spShield);
    assert(scn.hero.shield < shBefore || scn.hero.hp < scn.hero.maxHp,
      '陷阱伤害优先扣护盾（同一套伤害出口）', shBefore + ' → ' + Math.round(scn.hero.shield));
    scn.hero.shield = 0;

    section('14b. 穿刺：预警期内横向走出去 → 躲开');
    scn.clearTraps();
    var sp2 = scn.spawnTrap('spike', { level: dSpike.level, y: dSpike.y });
    sp2.x = 300;
    scn.hero.hp = scn.hero.maxHp;
    scn.hero.shield = 0;
    scn.invulnUntil = 0;
    scn.hero.body.reset(300, dSpike.y - 10);
    await sleep(680);                       // 站够 → 进入预警
    assert(sp2.state === 'warn', '已进入预警', sp2.state);
    scn.hero.body.reset(300 + 140, dSpike.y - 10);   // 0.25s 内跑出 48px 区段
    var hpBeforeDodge = scn.hero.hp;
    await sleep(400);
    assert(scn.hero.hp === hpBeforeDodge, '躲开了 → 不掉血', hpBeforeDodge + ' → ' + Math.round(scn.hero.hp));
    assert(sp2.state === 'cool', '照样烧掉一次（对的操作有回报）', sp2.state);

    section('14c. 无敌帧内不结算');
    scn.clearTraps();
    var sp3 = scn.spawnTrap('spike', { level: dSpike.level, y: dSpike.y });
    sp3.x = 300;
    scn.hero.hp = scn.hero.maxHp;
    scn.hero.shield = 0;
    scn.hero.body.reset(300, dSpike.y - 10);
    await sleep(630);
    scn.invulnUntil = scn.time.now + 900;   // 闪避无敌
    var hpInv = scn.hero.hp;
    await sleep(400);
    assert(scn.hero.hp === hpInv, '无敌帧内陷阱不结算', hpInv + ' → ' + Math.round(scn.hero.hp));
    scn.invulnUntil = 0;

    section('14d. 坠物：进入落点立刻预警（只有声音）+ 受伤');
    scn.clearTraps();
    var dFall = A.debug().tower.decks[2];
    var fl = scn.spawnTrap('fall', { level: dFall.level, y: dFall.y });
    fl.x = 300;
    scn.hero.hp = scn.hero.maxHp;
    scn.hero.shield = 0;
    scn.hero.body.reset(300, dFall.y - 10);
    await sleep(120);
    assert(fl.state === 'warn', '进入落点立刻预警（不等停留）', fl.state);
    var hpFall = scn.hero.hp;
    await sleep(700);
    assert(scn.hero.hp < hpFall, '0.35s 后砸中并造成伤害', hpFall + ' → ' + Math.round(scn.hero.hp));

    section('14e. 冷却是 3 秒');
    scn.clearTraps();
    var sp4 = scn.spawnTrap('spike', { level: dSpike.level, y: dSpike.y });
    sp4.x = 300;
    scn.hero.hp = scn.hero.maxHp;
    scn.hero.body.reset(300, dSpike.y - 10);
    await sleep(1000);                       // 站够 + 触发
    var coolState = sp4.state;
    await sleep(400);
    assert(coolState === 'cool' || sp4.state === 'cool', '触发后处于冷却', sp4.state);
    await sleep(3000);
    assert(sp4.state === 'idle', '3s 后回到待触发', sp4.state);

    section('16. 批9 · 第 6 层起出现竖塔 + 回退开关');
    var cnt5 = {}, cnt6 = {}, cnt20 = {};
    for (var si = 0; si < 600; si++) {
      var k5 = scn.pickSkeleton({ floor: 5, roomType: 'enemy', nonCombat: false });
      cnt5[k5] = (cnt5[k5] || 0) + 1;
      var k6 = scn.pickSkeleton({ floor: 6, roomType: 'enemy', nonCombat: false });
      cnt6[k6] = (cnt6[k6] || 0) + 1;
      var k20 = scn.pickSkeleton({ floor: 20, roomType: 'enemy', nonCombat: false });
      cnt20[k20] = (cnt20[k20] || 0) + 1;
    }
    assert(!cnt5.vertical, '第 5 层抽不到竖塔', JSON.stringify(cnt5));
    assert((cnt6.vertical || 0) > 0, '第 6 层起抽得到竖塔', JSON.stringify(cnt6));
    var v20 = (cnt20.vertical || 0) / 600;
    assert(v20 >= 0.08 && v20 <= 0.24, '第 16 层以后竖塔 ≈15%', Math.round(v20 * 100) + '%');
    var bossK = scn.pickSkeleton({ floor: 20, roomType: 'boss', nonCombat: false });
    assert(bossK === 'flat', '层主房仍是平厅', bossK);
    var eliteK = scn.pickSkeleton({ floor: 20, roomType: 'elite', nonCombat: false });
    assert(eliteK !== 'vertical', '精英房不抽竖塔', eliteK);
    var mirK = scn.pickSkeleton({ floor: 20, roomType: 'mirror', nonCombat: false });
    assert(mirK !== 'vertical', '镜像房不抽竖塔', mirK);

    A.setSkeletonVertical(false);
    var offCnt = 0;
    for (var si2 = 0; si2 < 300; si2++) {
      if (scn.pickSkeleton({ floor: 20, roomType: 'enemy', nonCombat: false }) === 'vertical') offCnt++;
    }
    assert(offCnt === 0, 'SKELETON.vertical=off → 一键退回（0 竖塔）', offCnt);
    A.setSkeletonVertical(true);
    assert(A.getSkeletonVertical().vertical === 'on', '重新打开竖塔');

    section('17. 批9 · 五种陷阱都投放 + 禁止组合');
    var seen = {}, pairSample = 0, bannedHit = 0;
    var BANNED = [['press', 'fall'], ['press', 'spike']];
    for (var bi = 0; bi < 26; bi++) {
      A.buildTowerRoom({ type: 'enemy' });
      await sleep(160);
      var tset = A.debug().tower.traps || [];
      var byLv = {};
      tset.forEach(function (t) {
        seen[t.kind] = (seen[t.kind] || 0) + 1;
        (byLv[t.level] = byLv[t.level] || []).push(t.kind);
      });
      Object.keys(byLv).forEach(function (lv) {
        if (byLv[lv].length < 2) return;
        pairSample++;
        for (var q = 0; q < BANNED.length; q++) {
          var has1 = byLv[lv].indexOf(BANNED[q][0]) >= 0, has2 = byLv[lv].indexOf(BANNED[q][1]) >= 0;
          if (has1 && has2) bannedHit++;
        }
      });
    }
    log('  抽样：' + JSON.stringify(seen) + ' · 双陷阱层 ' + pairSample, 'dim');
    ['spike', 'fall', 'plate', 'press', 'arrow'].forEach(function (k) {
      assert((seen[k] || 0) > 0, '出现过「' + k + '」', seen[k] || 0);
    });
    assert(bannedHit === 0, '无解组合（夹击门+坠物 / 夹击门+穿刺）从不出现',
      bannedHit + ' / ' + pairSample);
    assert(scn.trapPairOk('press', 'fall') === false, 'trapPairOk 认得禁止组合');
    assert(scn.trapPairOk('spike', 'fall') === true, 'trapPairOk 放行有解组合');

    section('18. 落板：站 2.5s → 掉下一层（不伤害）');
    A.setGodMode(false);
    A.buildTowerRoom({ type: 'enemy' });
    await sleep(400);
    scn.clearTraps();
    // 清掉敌人：这几节验的是"陷阱本身伤不伤人"，不能有怪在旁边补刀
    scn.enemies.slice().forEach(function (e) { if (e && e.alive) { try { scn.dropEnemy(e); } catch (err) {} } });
    await sleep(120);
    var dP = A.debug().tower.decks[1];
    var pl = scn.spawnTrap('plate', { level: dP.level, y: dP.y });
    pl.x = 300;
    scn.hero.hp = scn.hero.maxHp; scn.hero.shield = 0;
    scn.invulnUntil = 0;
    scn.hero.body.reset(300, dP.y - 10);
    await sleep(500);
    assert(pl.state === 'idle', '站 0.5s 还不会塌（要 2.5s）', pl.state);
    await sleep(2300);
    assert(pl.state !== 'idle', '站满 2.5s → 塌（预警或已触发）', pl.state);
    var hpPlate = scn.hero.hp;
    await sleep(1200);
    var yPlate = A.debug().hero.y;
    assert(Math.abs(yPlate - (dP.y + 220 - 10)) <= 24, '掉到下一层', yPlate + ' vs ' + (dP.y + 210));
    assert(scn.hero.hp === hpPlate, '落板不伤害（它惩罚的是犹豫）', hpPlate + ' → ' + Math.round(scn.hero.hp));

    section('19. 夹击门：停留 0.4s + 预警 0.45s → 100% 伤害 + 硬直');
    scn.clearTraps();
    scn.enemies.slice().forEach(function (e) { if (e && e.alive) { try { scn.dropEnemy(e); } catch (err) {} } });
    var dPr = A.debug().tower.decks[2];
    var pr = scn.spawnTrap('press', { level: dPr.level, y: dPr.y });
    pr.x = 300;
    scn.hero.hp = scn.hero.maxHp; scn.hero.shield = 0;
    scn.invulnUntil = 0; scn.heroStunUntil = 0;
    scn.hero.body.reset(300, dPr.y - 10);
    await sleep(520);
    assert(pr.state === 'warn', '停留 0.4s → 预警', pr.state);
    var hpPress = scn.hero.hp;
    await sleep(600);
    assert(scn.hero.hp < hpPress, '合拢造成伤害', hpPress + ' → ' + Math.round(scn.hero.hp));
    assert((scn.heroStunUntil || 0) > 0, '附带了硬直', Math.round((scn.heroStunUntil || 0) - scn.time.now));
    scn.heroStunUntil = 0;

    section('19b. 夹击门：跑出 80px 就能躲（0.45s × 250 = 112px）');
    scn.clearTraps();
    var pr2 = scn.spawnTrap('press', { level: dPr.level, y: dPr.y });
    pr2.x = 300;
    scn.hero.hp = scn.hero.maxHp; scn.hero.shield = 0;
    scn.invulnUntil = 0;
    scn.hero.body.reset(300, dPr.y - 10);
    await sleep(520);
    assert(pr2.state === 'warn', '已进入预警', pr2.state);
    scn.hero.body.reset(300 + 110, dPr.y - 10);
    var hpPress2 = scn.hero.hp;
    await sleep(700);
    assert(scn.hero.hp === hpPress2, '跑出去 → 躲开', hpPress2 + ' → ' + Math.round(scn.hero.hp));

    section('20. 暗箭：进入该层触发一次，跳起来能躲');
    scn.clearTraps();
    scn.enemies.slice().forEach(function (e) { if (e && e.alive) { try { scn.dropEnemy(e); } catch (err) {} } });
    var dAr = A.debug().tower.decks[3];
    var ar = scn.spawnTrap('arrow', { level: dAr.level, y: dAr.y });
    ar.x = 300;
    scn.hero.hp = scn.hero.maxHp; scn.hero.shield = 0;
    scn.invulnUntil = 0;
    scn.hero.body.reset(300, dAr.y - 10);
    await sleep(150);
    assert(ar.state === 'warn', '进入该层 → 立刻预警', ar.state);
    var hpArrow = scn.hero.hp;
    await sleep(1000);
    assert(scn.hero.hp < hpArrow, '站着 → 被射中', hpArrow + ' → ' + Math.round(scn.hero.hp));

    scn.clearTraps();
    var ar2 = scn.spawnTrap('arrow', { level: dAr.level, y: dAr.y });
    ar2.x = 300;
    scn.hero.hp = scn.hero.maxHp; scn.hero.shield = 0;
    scn.invulnUntil = 0;
    scn.hero.body.reset(300, dAr.y - 10);
    await sleep(120);
    scn.hero.setVelocityY(-1150);       // 跳起来（箭贴楼板上方 24px 飞过）
    var hpArrow2 = scn.hero.hp;
    await sleep(1100);
    assert(scn.hero.hp === hpArrow2, '跳起来躲开（这条解法只有"跳"）',
      hpArrow2 + ' → ' + Math.round(scn.hero.hp));
    scn.heroStunUntil = 0;

    section('15. 横厅没有陷阱 + 收尾');
    scn._forceSkeleton = null;
    scn.buildLevel({ type: 'enemy', col: 0, row: 1 });
    await sleep(400);
    assert(!A.debug().tower, '平厅不建竖塔');
    assert((scn.traps || []).length === 0, '横厅没有任何陷阱', (scn.traps || []).length);
    A.setGodMode(false);
    A.setGodMode(false);
    assert(scn.running !== false || true, '场景仍在运行');

    log('');
    log(fail === 0 ? ('全部通过：' + pass + ' 项') : ('失败 ' + fail + ' 项 / 通过 ' + pass + ' 项'),
      fail === 0 ? 'ok' : 'bad');
  }

  var running = false;
  async function start() {
    if (running) return; running = true;
    try { await run(); } catch (e) { log('异常：' + (e && e.stack || e), 'bad'); }
    running = false;
  }
  document.getElementById('rerun').addEventListener('click', function () { start(); });
  setTimeout(start, 300);
})();
</script>
</body>
</html>
