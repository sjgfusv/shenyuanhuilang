<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>深渊回廊 · 2D 引擎回归</title>
<style>
  body { margin: 0; background: #0a0e18; color: #e8eefc; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #panel {
    position: fixed; left: 12px; top: 12px; z-index: 10;
    max-width: 560px; max-height: 92vh; overflow: auto;
    background: rgba(15,22,44,.94); border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px; padding: 14px 16px; font-size: 13px; line-height: 1.65;
  }
  h1 { font-size: 15px; margin: 0 0 8px; color: #f0d06a; letter-spacing: .05em; }
  .ok { color: #73f0b4; } .bad { color: #ff5d7a; } .dim { color: #90a2c8; }
  pre { margin: 0; white-space: pre-wrap; }
  button { margin-top: 8px; padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(115,240,180,.4);
    background: rgba(115,240,180,.12); color: #73f0b4; cursor: pointer; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="panel">
  <h1>2D 引擎回归（P5-3 · 自包含）</h1>
  <div class="dim">这些断言覆盖 2.7 改动的核心：数值统一 / 遗物机制常量 / 面板承载 / 无敌。/ 房间规划。<br>它只加载引擎，不需要内核，所以能独立打开。</div>
  <button id="rerun">重新跑一遍</button>
  <pre id="out">准备中…</pre>
</div>
<script src="../vendor/phaser.min.js?v=20261024"></script>
<script src="../角色形象.js?v=20261024"></script>
<script src="../战斗2D.js?v=20261024"></script>
<script>
(function () {
  var out = document.getElementById('out');
  var lines = [];
  var pass = 0, fail = 0;
  function log(s, cls) { lines.push(cls ? '<span class="' + cls + '">' + s + '</span>' : s); out.innerHTML = lines.join('\n'); }
  function section(t) { lines.push(''); log('── ' + t + ' ──', 'dim'); }
  function assert(cond, msg, extra) {
    if (cond) { pass++; log('  ✓ ' + msg, 'ok'); }
    else { fail++; log('  ✗ ' + msg + (extra != null ? '  → ' + extra : ''), 'bad'); }
  }

  function run() {
    lines = []; pass = 0; fail = 0;
    var A = window.战斗2D;
    log('引擎: ' + (A ? '已加载' : '未加载'), A ? 'ok' : 'bad');
    if (!A) return;

    var d = A.debug();
    if (!d.ready) {
      // 首次进来要自己把引擎拉起来 —— 这个页面只加载引擎，没有任何宿主会替你 init
      if (!d.booted) {
        var ok = false;
        try { ok = A.init(document.getElementById('stage'), true); } catch (e) { log('init 抛异常：' + e, 'bad'); return; }
        if (ok) A.show();
      }
      log('等引擎就绪…', 'dim');
      requestAnimationFrame(run);
      return;
    }

    /* ---------- 1. 数值统一（P3-1 的核心） ---------- */
    section('1. 敌人数值：setEnemyScaler 的接线与容错');
    var g = A.getGame();
    var sc = g.scene.scenes.filter(function (x) { return x && x.ready; })[0];
    var DEFS = {
      claw: { tier: 'normal', hp: 24, atk: 4 },
      guard: { tier: 'elite', hp: 72, atk: 11 },
      lord: { tier: 'boss', hp: 160, atk: 14 }
    };
    // 这个页面没有宿主，引擎按设计走内置曲线 —— 先记下它的值，一会儿用来验"容错退回"
    var builtin = sc.enemyStats(DEFS.claw, 1, 'claw').hp;
    assert(builtin === 24, '无宿主时退回内置曲线（claw = 24）', builtin);
    // 下发一个宿主式的 scaler：量级听经典、相对强弱用 baseHp 系数（与 经典2D.js 同一套思路）
    A.setEnemyScaler(function (info) {
      var base = info.floor * 2 + 4;
      var ref = { normal: 24, mirror: 42, elite: 72, boss: 160 }[info.tier] || 24;
      var hpBase = info.tier === 'boss' ? base + 10 : (info.tier === 'elite' ? base + 6 : base);
      return { hp: Math.round(hpBase * (info.baseHp / ref)), atk: 3 };
    });
    assert(sc.enemyStats(DEFS.claw, 1, 'claw').hp === 6, '下发后层 1 普通怪 hp = 6（经典 base）', sc.enemyStats(DEFS.claw, 1, 'claw').hp);
    assert(sc.enemyStats(DEFS.lord, 1, 'lord').hp === 16, '层 1 Boss hp = 16', sc.enemyStats(DEFS.lord, 1, 'lord').hp);
    assert(sc.enemyStats(DEFS.lord, 50, 'lord').hp === 114, '层 50 Boss hp = 114', sc.enemyStats(DEFS.lord, 50, 'lord').hp);
    assert(sc.enemyStats(DEFS.guard, 1, 'guard').hp === 12, '层 1 精英 hp = 12（base+6）', sc.enemyStats(DEFS.guard, 1, 'guard').hp);
    // 宿主算错不能把刷怪打断
    A.setEnemyScaler(function () { throw new Error('故意炸'); });
    assert(sc.enemyStats(DEFS.claw, 1, 'claw').hp === builtin, 'scaler 抛异常 → 自动退回内置曲线', sc.enemyStats(DEFS.claw, 1, 'claw').hp);
    A.setEnemyScaler(null);
    assert(sc.enemyStats(DEFS.claw, 1, 'claw').hp === builtin, 'setEnemyScaler(null) → 回到内置曲线');

    /* ---------- 2. 遗物机制常量（P3-3 的核心） ---------- */
    section('2. 遗物 → 机制常量（基准 + 增量，不累加）');
    A.setRelics(['perfectInstinct', 'windShadow', 'ironWall', 'chainMaster', 'lightBoots', 'piercingArrow', 'sharpCore']);
    var m = A.debug().mech;
    assert(m.dodgePerfect === 230, '完美直觉：完美闪避窗口 150 → 230', m.dodgePerfect);
    assert(m.dodgeInvuln === 440, '疾风残影：无敌帧 320 → 440', m.dodgeInvuln);
    assert(m.guardPerfect === 280, '铁壁：完美格挡 200 → 280', m.guardPerfect);
    assert(m.chainWindow === 1010, '连击大师：连招窗口 760 → 1010', m.chainWindow);
    assert(m.staminaMax === 130, '轻盈之靴：体力上限 100 → 130', m.staminaMax);
    // 2.9.2 F7：穿透之矢按武器换整套 —— 近战装它是「裂阵」（横扫多命中 1 个），
    // 远程才是「穿透之矢」。所以近战不该加穿透，改断 sweepExtra。
    var scn = A.getGame().scene.getScene('TrialBattle');
    assert(m.weapon === 'melee' && m.rangedPierce === 2, '近战装穿透之矢 → 不加穿透（换成了裂阵）',
      m.weapon + '/' + m.rangedPierce);
    assert(m.sweepExtra === 1, '裂阵：横扫额外多命中 1 个', m.sweepExtra);
    var prevLook = scn.heroLookId;
    scn.heroLookId = 'ranger';                 // 站到远程英雄的位置上重算同一件遗物
    A.setRelics(['piercingArrow']);
    var mr = A.debug().mech;
    assert(mr.weapon === 'ranged' && mr.rangedPierce === 3, '远程英雄装同一件 → 穿透 2 → 3',
      mr.weapon + '/' + mr.rangedPierce);
    assert(mr.sweepExtra === 0, '远程英雄不再有裂阵的横扫加成', mr.sweepExtra);
    scn.heroLookId = prevLook;
    A.setRelics(['piercingArrow']);
    assert(A.debug().mech.sweepExtra === 1, '切回近战 → 效果切回裂阵', A.debug().mech.sweepExtra);
    assert(m.dodgeSharpMult === 3, '锐利核心：锐利倍率 2.2 → 3.0', m.dodgeSharpMult);
    // 反复下发不累加
    A.setRelics([]);
    A.setRelics(['perfectInstinct']);
    assert(A.debug().mech.dodgePerfect === 230, '反复下发不累加（清空再装仍是 230）', A.debug().mech.dodgePerfect);
    A.setRelics([]);
    assert(A.debug().mech.dodgePerfect === 150, '清空遗物后回到基准 150', A.debug().mech.dodgePerfect);

    /* ---------- 3. 面板承载（P3-5 的截断：结局 12 种原来卡在 6，选不到） ---------- */
    section('3. 画内面板：上限 12（结局 12 种全装得下）、每行 5 张自动换行');
    // 后台标签里 rAF 不跑，Phaser 的 ScaleManager 不做布局 → scale 停在 0×0，
    // 而 openChoicePanel 有"画幅太小就不开"的守卫，会直接返回 false。
    // 注意：scale.width 是**只读 getter**（赋值无效），scale.resize()/refresh() 在后台标签
    // 也不生效 —— 所以只能临时把 scene.scale 这一个引用换成最小替身（面板布局只读 width/height）。
    var sc3 = A.getGame().scene.getScene('TrialBattle');
    var realScale = sc3.scale;
    var w0 = realScale.width, h0 = realScale.height;
    var stubbed = !(w0 >= 40) || !(h0 >= 40);
    if (stubbed) sc3.scale = { width: 1280, height: 720 };
    var cards13 = [];
    for (var ci = 0; ci < 13; ci++) cards13.push({ id: 'c' + ci, name: 'C' + ci });
    A.openEventPanel('test', { title: '上限测试', cards: cards13 });
    assert(A.debug().choiceCards.length === 12, '传 13 张 → 实际承载 12 张（getEndOptions 最多 12 种，正好装下）', A.debug().choiceCards.length);
    A.closeChoicePanel(null);
    assert(!A.isChoiceOpen(), '面板可正常关闭');
    if (stubbed) sc3.scale = realScale;   // 立刻还回去，别影响后面读 scale 的路径

    /* 结局面板最多 12 张：一行 5 张装不下，必须换行；手机横屏 774×334 是最窄的真实画布 */
    var sc12 = A.getGame().scene.getScene('TrialBattle');
    sc12.choiceData = { title: '深渊尽头', desc: '', actions: [] };
    sc12.choiceCards = [];
    for (var hi = 0; hi < 12; hi++) sc12.choiceCards.push({ id: String(hi), name: '结局' + (hi + 1), desc: '', quality: 'legendary' });
    sc12.choiceOpen = true;
    sc12.buildChoiceLayer(774, 334);
    var rects = sc12.choiceRects || [];
    var rowMap = {};
    rects.forEach(function (r) { var k = Math.round(r.y); rowMap[k] = (rowMap[k] || 0) + 1; });
    var rowCounts = Object.keys(rowMap).map(function (k) { return rowMap[k]; });
    var maxX = rects.length ? Math.max.apply(null, rects.map(function (r) { return r.x + r.w; })) : 0;
    var maxY = rects.length ? Math.max.apply(null, rects.map(function (r) { return r.y + r.h / 2; })) : 0;
    assert(rects.length === 12, '12 张结局卡全部建出（不截断）', rects.length);
    assert(rowCounts.join('+') === '5+5+2', '774×334 下排成 5 + 5 + 2 三行', rowCounts.join('+'));
    assert(maxX <= 774 && maxY <= 334, '卡片完全落在手机横屏画布内（不溢出）', maxX + ' / ' + maxY);
    sc12.destroyLayer('choiceLayer'); sc12.choiceRects = []; sc12.choiceCards = []; sc12.choiceOpen = false;

    /* ---------- 4. 无敌（P4-1 的核心） ---------- */
    section('4. 无敌开关（damageHero 直接免疫）');
    A.setGodMode(true);
    assert(A.isGodMode() === true, 'setGodMode(true) 生效');
    A.setGodMode(false);
    assert(A.isGodMode() === false, 'setGodMode(false) 生效');

    /* ---------- 5. 房间规划主权（P1 的核心） ---------- */
    section('5. setFloorPlan：宿主全权控制房间序列');
    /* floorMap 只在开局后才有 → 每验一种写法就先下发、再开一局 */
    function boot() {
      A.startRun({
        heroName: '回归测试', points: 0,
        player: { maxHp: 100, hp: 100, attack: 10 },
        difficulty: 'normal', heroId: 'warrior',
        skill: { id: 'warrior' }, curses: [], environment: null
      });
    }
    A.setFloorPlan({ rooms: ['enemy', 'treasure', 'boss'] });
    boot();
    var plan = A.press('roomPlan') || [];
    assert(JSON.stringify(plan) === JSON.stringify(['start', 'enemy', 'treasure', 'boss']),
      'rooms 简写自动补入口：[' + plan.join(',') + ']');
    A.setFloorPlan({ cols: [['enemy'], ['rest'], ['boss']] });
    boot();
    var plan2 = A.press('roomPlan') || [];
    assert(JSON.stringify(plan2) === JSON.stringify(['enemy', 'rest', 'boss']),
      'cols 形式不补入口（宿主全权）：[' + plan2.join(',') + ']');
    A.setFloorPlan(null);
    assert(A.debug().floorPlan === false, 'setFloorPlan(null) 恢复内置自造地图');

    /* ---------- 6. 脉冲节拍（P3-1 §3.12） ---------- */
    section('6. 脉冲节拍曲线');
    A.setPulseProfile({ start: 4000, step: 500, min: 2000, warn: 1200 });
    assert(A.getPulseInterval() === 4000, '第 1 层未清房 = 4000ms', A.getPulseInterval());
    A.setPulseProfile(null);
    assert(A.getPulseInterval() === 5000, '恢复默认（normal 基准 5000）', A.getPulseInterval());

    /* ---------- 汇总 ---------- */
    lines.push('');
    log(fail === 0 ? ('全部通过：' + pass + ' 项') : ('通过 ' + pass + ' 项，失败 ' + fail + ' 项'),
      fail === 0 ? 'ok' : 'bad');
  }

  document.getElementById('rerun').addEventListener('click', run);
  window.addEventListener('load', run);
  setTimeout(run, 400);   // 引擎 boot 兜底
})();
</script>
</body>
</html>
