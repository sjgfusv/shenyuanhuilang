<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>深渊回廊 · 3.0 总回归（串行跑完全部测试页）</title>
<style>
  body { margin:0; background:#0a0e18; color:#e8eefc; font-family:"Microsoft YaHei",system-ui,sans-serif; }
  #panel { position:fixed; inset:0; z-index:10; overflow:auto; padding:14px 18px;
    background:#0a0e18; font-size:13px; line-height:1.7; }
  h1 { font-size:15px; margin:0 0 8px; color:#f0d06a; letter-spacing:.05em; }
  .ok { color:#73f0b4; } .bad { color:#ff5d7a; } .dim { color:#90a2c8; }
  pre { margin:0; white-space:pre-wrap; }
  iframe { position:fixed; left:-20000px; top:0; width:1280px; height:720px; border:0; visibility:hidden; }
  button { margin-top:8px; padding:6px 12px; border-radius:6px; border:1px solid rgba(115,240,180,.4);
    background:rgba(115,240,180,.12); color:#73f0b4; cursor:pointer; }
</style>
</head>
<body>
<div id="panel">
  <h1>3.0 · 总回归（367 项断言）</h1>
  <div class="dim">串行加载 <code>测试/</code> 下 7 个回归页，读回各自的「全部通过 N 项」。
    任何一个页面变红就说明这一批动了不该动的地方。</div>
  <button id="rerun">重新跑一遍</button>
  <pre id="out">准备中…</pre>
</div>
<script>
(function () {
  // min = 该页在无回归时的断言数下限（部分页有随机抽样，条目数会小幅波动）
  var PAGES = [
    { name: 'P0-P3结构回归.html', min: 68 },
    { name: 'P4机制验证.html', min: 129 },
    { name: '2.9.1修复验证.html', min: 35 },
    { name: '2.9.2核心与断桥.html', min: 52 },
    { name: '2.9.2投放与遗物.html', min: 29 },
    { name: '2D引擎回归.html', min: 31 },
    { name: 'P5投放与回归.html', min: 16 }
  ];
  var out = document.getElementById('out'), lines = [];
  function log(s, cls) { lines.push(cls ? '<span class="' + cls + '">' + s + '</span>' : s); out.innerHTML = lines.join('\n'); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function runOne(name) {
    var f = document.createElement('iframe');
    f.src = name + '?t=' + Date.now();
    document.body.appendChild(f);
    var t0 = Date.now(), last = '', stable = 0, text = '';
    while (Date.now() - t0 < 150000) {
      await sleep(700);
      try {
        var doc = f.contentDocument;
        var el = doc && doc.getElementById('out');
        text = el ? (el.innerText || '') : '';
      } catch (e) { text = ''; }
      // 完成判据：出现「全部通过」或「失败 N 项」或「异常：」
      if (/全部通过[：:]\s*\d+\s*项/.test(text) || /失败\s*\d+\s*项/.test(text) || /异常[：:]/.test(text)) {
        if (text === last) { stable++; if (stable >= 2) break; } else { stable = 0; last = text; }
      }
    }
    try { f.remove(); } catch (e) { /* 忽略 */ }
    return text;
  }

  async function run() {
    lines = [];
    var totalPass = 0, totalFail = 0, badPages = [];
    for (var i = 0; i < PAGES.length; i++) {
      var page = PAGES[i];
      var name = page.name;
      log('▸ ' + name + ' …', 'dim');
      var text = await runOne(name);
      var m = text.match(/全部通过[：:]\s*(\d+)\s*项/);
      // 断言数低于下限 → 大概率是随机抽样少跑了分支，重跑一次再判
      if (m && parseInt(m[1], 10) < page.min) {
        log('  · ' + name + ' 只跑了 ' + m[1] + ' 项（< ' + page.min + '，疑似随机抽样），重跑…', 'dim');
        text = await runOne(name);
        m = text.match(/全部通过[：:]\s*(\d+)\s*项/);
      }
      // 失败页的汇总有两种写法（不同测试页历史不同）：统一成 { pass, fail }
      var failInfo = null;
      var mfa = text.match(/失败\s*(\d+)\s*项\s*\/\s*通过\s*(\d+)\s*项/);
      if (mfa) failInfo = { fail: parseInt(mfa[1], 10), pass: parseInt(mfa[2], 10) };
      if (!failInfo) {
        var mfb = text.match(/通过\s*(\d+)\s*项[，,]\s*失败\s*(\d+)\s*项/);
        if (mfb) failInfo = { fail: parseInt(mfb[2], 10), pass: parseInt(mfb[1], 10) };
      }
      var badLines = text.split('\n').filter(function (l) { return l.indexOf('✗') >= 0; });
      if (m) {
        totalPass += parseInt(m[1], 10);
        log('  ✓ ' + name + ' · 全部通过 ' + m[1] + ' 项', 'ok');
      } else if (failInfo) {
        totalPass += failInfo.pass;
        totalFail += failInfo.fail;
        badPages.push(name);
        log('  ✗ ' + name + ' · 失败 ' + failInfo.fail + ' 项 / 通过 ' + failInfo.pass + ' 项', 'bad');
        badLines.slice(0, 12).forEach(function (l) { log('      ' + l.trim(), 'bad'); });
      } else {
        badPages.push(name);
        totalFail += 1;
        log('  ✗ ' + name + ' · 未跑完或异常', 'bad');
        var tail = text.split('\n').slice(-6).join('\n');
        if (tail) log('      ' + tail.replace(/\n/g, '\n      '), 'bad');
      }
    }
    log('');
    if (!badPages.length) {
      log('总回归全部通过：' + totalPass + ' 项', 'ok');
    } else {
      log('总回归：失败页 ' + badPages.join(' / ') + ' · 通过 ' + totalPass + ' 项 · 失败 ' + totalFail + ' 项', 'bad');
    }
    document.title = (badPages.length ? '✗ ' : '✓ ') + '3.0 总回归 ' + totalPass + ' 项';
  }

  var running = false;
  async function start() {
    if (running) return; running = true;
    try { await run(); } catch (e) { log('异常：' + (e && e.stack || e), 'bad'); }
    running = false;
  }
  document.getElementById('rerun').addEventListener('click', function () { start(); });
  setTimeout(start, 200);
})();
</script>
</body>
</html>
