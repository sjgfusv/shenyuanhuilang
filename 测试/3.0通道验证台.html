<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>深渊回廊 · 3.0 下发通道验证台</title>
<style>
  body { margin:0; background:#0a0e18; color:#e8eefc; font-family:"Microsoft YaHei",system-ui,sans-serif; }
  #trial2DCanvasHost { position:fixed; inset:0; }
  #panel { position:fixed; left:12px; top:12px; z-index:10; max-width:760px; max-height:92vh; overflow:auto;
    background:rgba(15,22,44,.94); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.65; }
  h1 { font-size:15px; margin:0 0 8px; color:#f0d06a; letter-spacing:.05em; }
  .ok { color:#73f0b4; } .bad { color:#ff5d7a; } .dim { color:#90a2c8; } .warn { color:#ffd76a; }
  pre { margin:0; white-space:pre-wrap; }
  button { margin-top:8px; padding:6px 12px; border-radius:6px; border:1px solid rgba(115,240,180,.4);
    background:rgba(115,240,180,.12); color:#73f0b4; cursor:pointer; }
</style>
</head>
<body>
<div id="trial2DCanvasHost"></div>
<div id="panel">
  <h1>3.0 · 下发通道 / 文字时代概念 / 名字 / 反馈 验证台</h1>
  <div class="dim">真引擎（战斗2D）+ 真宿主（经典2D）+ 最小 mock 内核。
    覆盖批 1~4：奖励立即生效 / 事件扣血不回滚 / 事件遗物下发 / 护盾不白送 /
    经验支付 / 力量药水 / 双倍金币 / 生命护盾 / 遗物显示名 / 变化横幅。</div>
  <button id="rerun">重新跑一遍</button>
  <pre id="out">准备中…</pre>
</div>
<script src="../vendor/phaser.min.js?v=20261031-30"></script>
<script src="../角色形象.js?v=20261031-30"></script>
<script src="../战斗2D.js?v=20261031-30"></script>
<script src="../经典2D.js?v=20261031-30"></script>
<script>
(function () {
  var out = document.getElementById('out'), lines = [], pass = 0, fail = 0;
  function log(s, cls) { lines.push(cls ? '<span class="' + cls + '">' + s + '</span>' : s); out.innerHTML = lines.join('\n'); }
  function section(t) { lines.push(''); log('── ' + t + ' ──', 'dim'); }
  function assert(c, msg, extra) { if (c) { pass++; log('  ✓ ' + msg, 'ok'); } else { fail++; log('  ✗ ' + msg + (extra != null ? '  → ' + extra : ''), 'bad'); } }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var A = window.战斗2D, D = window.经典2D, LOGS = [];

  /* ---------- 最小 mock 内核：只实现 经典2D 真正会调的那几个 ---------- */
  function mockKernel() {
    return {
      state: function () { return window.state; },
      addLog: function (t) { LOGS.push(String(t)); },
      generateFloorRooms: function () { return [{ type: 'enemy' }, { type: 'enemy' }, { type: 'boss' }]; },
      generateEnvironmentEffect: function () { return null; },
      formatEnvDescription: function () { return ''; },
      difficultyModifiers: function () { return { normal: { goldReward: 1, restBonus: 0 } }; },
      normalizeCustomDifficulty: function () { return {}; },
      getShopItemCost: function (it) { return it.cost; },
      buildShopOptions: function () { return []; },
      buildRewardOptions: function () { return []; },
      getRandomEvent: function () { return []; },
      getEndOptions: function () { return []; },
      countRelic: function () { return 0; },
      saveGame: function () {}, updateRecords: function () {}, showToast: function () {},
      shopCatalog: function () { return []; }, bonusPool: function () { return []; }, eventPool: function () { return []; }
    };
  }

  function resetState() {
    window.state = {
      hero: { id: 'warrior', name: '验证者', skill: { id: 'warrior', name: '狂战', active: { name: '狂暴', description: '' } } },
      player: { hp: 100, maxHp: 100, attack: 10, shield: 0, potions: 2, gold: 50, xp: 30, strengthPotions: 2 },
      floor: 1, roomIndex: 0,
      rooms: [{ type: 'enemy' }, { type: 'enemy' }, { type: 'boss' }],
      difficulty: 'normal', relics: [], curses: [], gameOver: false, mode: 'event',
      currentRoom: { type: 'enemy' }, critDamage: 150,
      luckyLevel: 0, dodgeLevel: 0, thornLevel: 0, vampireLevel: 0, comboLevel: 0, executeLevel: 0
    };
    return window.state;
  }

  function eng() { return A.debug(); }
  function heroDbg() { var d = A.debug(); return (d && d.hero) || {}; }

  async function run() {
    lines = []; pass = 0; fail = 0;
    A = window.战斗2D; D = window.经典2D;
    log('引擎: ' + (A ? '已加载' : '未加载') + ' · 宿主: ' + (D ? '已加载' : '未加载'), A && D ? 'ok' : 'bad');
    if (!A || !D) return;

    resetState();
    window.经典2D内核 = mockKernel();

    if (!A.debug().ready) {
      if (!A.debug().booted) { try { A.init(document.getElementById('trial2DCanvasHost'), true); } catch (e) { log('init 异常：' + e, 'bad'); return; } A.show(); }
      await sleep(400);
    }
    var r = D.start();
    await sleep(900);
    var d0 = eng();
    if (!d0.ready) { log('引擎未就绪：' + JSON.stringify({ ready: d0.ready, booted: d0.booted }), 'bad'); return; }
    A.setGodMode(true);

    /* ================= 1. 通道基线 ================= */
    section('1. 开局全量下发（基线）');
    var s = window.state;
    var h = heroDbg();
    assert(h.attack === s.player.attack, '开局引擎攻击 == 内核攻击', h.attack + ' / ' + s.player.attack);
    assert(h.hp === s.player.hp, '开局引擎生命 == 内核生命', h.hp + ' / ' + s.player.hp);
    assert(h.shield === s.player.shield, '开局引擎护盾 == 内核护盾', h.shield + ' / ' + s.player.shield);

    /* ================= 2. A1 奖励立即生效 ================= */
    section('2. A1 · 战斗奖励选完立即下发');
    s.player.attack = 10;
    D.pushStats();
    var atkBefore = heroDbg().attack;
    s.rewardOptions = [{ label: '攻击 +1', apply: function () { s.player.attack += 1; } }];
    A.openRewardChoice({ title: '战斗奖励', cards: [{ id: '0', name: '攻击 +1', desc: '' }] });
    await sleep(60);
    assert(A.isChoiceOpen() === true, '奖励面板已打开');
    A.closeChoicePanel({ kind: 'reward', id: '0' });
    await sleep(120);
    var atkAfter = heroDbg().attack;
    assert(s.player.attack === atkBefore + 1, '内核攻击 +1', s.player.attack);
    assert(atkAfter === s.player.attack, '引擎攻击当场跟上（不再等下次商店）', atkAfter + ' vs ' + s.player.attack);

    /* ================= 3. A2 事件扣血不回滚 ================= */
    section('3. A2 · 随机事件扣血 / 加血');
    s = resetState(); window.state.player.hp = 80;
    D.pushStats(); await sleep(80);
    s.player.hp = 60;
    s.eventOptions = [{ label: '诅咒之井', apply: function () { window.state.player.hp = 50; window.state.player.gold += 40; } }];
    A.openEventPanel('event', { title: '随机事件', cards: [{ id: '0', name: '诅咒之井', desc: '' }] });
    await sleep(60);
    A.closeChoicePanel({ kind: 'event', id: '0' });
    await sleep(150);
    var hpAfterEvent = heroDbg().hp;
    assert(window.state.player.hp === 50, '内核生命 = 50（献祭生效）', window.state.player.hp);
    assert(hpAfterEvent === 50, '引擎生命当场 = 50（没被清房 syncHp 回滚）', hpAfterEvent);

    section('3b. A2 · 事件加血 / 加盾');
    s = resetState(); s.player.hp = 60; s.player.shield = 0;
    D.pushStats(); await sleep(80);
    s.eventOptions = [{ label: '古树祝福', apply: function () { window.state.player.hp += 7; window.state.player.shield += 2; } }];
    A.openEventPanel('event', { title: '随机事件', cards: [{ id: '0', name: '古树祝福', desc: '' }] });
    await sleep(60);
    A.closeChoicePanel({ kind: 'event', id: '0' });
    await sleep(150);
    assert(heroDbg().hp === 67, '引擎生命 60 → 67', heroDbg().hp);
    assert(heroDbg().shield === 2, '引擎护盾 0 → 2', heroDbg().shield);

    /* ================= 4. A3 事件遗物下发 ================= */
    section('4. A3 · 事件遗物必须到引擎');
    s = resetState();
    D.pushStats(); D.pushRelics(); await sleep(80);
    var relicsBefore = (eng().relics || []).length;
    s.eventOptions = [{
      label: '暗影交易',
      apply: function () {
        // 照抄内核 chooseRelicByRarity 的行为：直接 state.relics.push(老遗物对象)
        window.state.relics.push({ label: '战斗怒火' });
        window.state.relics.push({ label: '生命结晶' });
        window.state.relics.push({ label: '铁卫纹章' });
        window.state.relics.push({ label: '双刃匕首' });
        window.state.relics.push({ label: '斩杀之镰' });
      }
    }];
    A.openEventPanel('event', { title: '随机事件', cards: [{ id: '0', name: '暗影交易', desc: '' }] });
    await sleep(60);
    A.closeChoicePanel({ kind: 'event', id: '0' });
    await sleep(150);
    var rel = eng().relics || [];
    assert(window.state.relics.length === 5, '内核手里 5 件遗物', window.state.relics.length);
    assert(rel.length === relicsBefore + 5, '引擎收到 5 件（relicIds 走 LEGACY_RELIC_MAP 翻译）', rel.length);
    assert(rel.indexOf('heavyStrike') >= 0 && rel.indexOf('ironWall') >= 0, '老 label 翻成了引擎 id', rel.join(','));

    /* ================= 5. A4 护盾不白送 ================= */
    section('5. A4 · 护盾只有单向同步');
    var scn = A.getGame().scene.getScene('TrialBattle');
    A.setGodMode(false);                       // 让伤害真的结算（无敌模式下 damageHero 直接免伤）
    s = resetState(); s.player.shield = 10; s.player.hp = 100;
    D.pushStats(); await sleep(100);
    scn.invulnUntil = 0; scn.guarding = false; scn.dodging = false;
    assert(heroDbg().shield === 10, '引擎护盾 10', heroDbg().shield);
    var kernelShieldBefore = window.state.player.shield;
    scn.damageHero(3, null);
    await sleep(80);
    var kernelShieldAfter = window.state.player.shield;
    assert(kernelShieldAfter === kernelShieldBefore - 3, '引擎扣盾 → 内核盾 10 → 7（consume 回写）',
      kernelShieldBefore + ' → ' + kernelShieldAfter);
    // 现在拿一件遗物：pushStats 不应把盾补回旧值
    var engShieldBefore = heroDbg().shield;
    D.cheat.addRelic('greedyHeart');
    await sleep(120);
    var engShieldAfter = heroDbg().shield;
    assert(engShieldAfter === engShieldBefore, '拿遗物后盾没有被补回内核旧值',
      engShieldBefore + ' → ' + engShieldAfter + '（内核 ' + window.state.player.shield + '）');

    section('5c. 引擎加盾也要记账（战士开局盾 / 魂晶回盾）');
    s = resetState(); s.player.shield = 0;
    D.pushStats(); await sleep(80);
    var sh0 = window.state.player.shield;
    scn.addShield(3, '测试护盾');
    await sleep(60);
    assert(window.state.player.shield === sh0 + 3, '引擎 addShield → 内核 +3（gain 回写）',
      sh0 + ' → ' + window.state.player.shield);
    D.pushStats(); await sleep(60);
    assert(heroDbg().shield === sh0 + 3, 'pushStats 后引擎的盾没被抹掉', heroDbg().shield);

    section('5b. 清房 syncShield 兜底');
    s = resetState(); s.player.shield = 8;
    D.pushStats(); await sleep(100);
    scn.hero.shield = 1;                 // 模拟引擎侧扣掉 7 点但没走 consume（比如旧代码路径）
    A.getGame().events.emit('rt:room-cleared', {
      reason: 'room-cleared', floor: s.floor, points: 50, hp: 90, maxHp: 100, shield: 1,
      potions: 2, roomType: 'enemy', room: { type: 'enemy', col: 0, row: 1 }, goldMul: 1, holdFailed: false
    });
    await sleep(120);
    assert(window.state.player.shield === 1, '清房把引擎盾写回内核（8 → 1）', window.state.player.shield);

    /* ================= 6. 批2 · 经验支付 ================= */
    section('6. 批2 · 经验作为第二货币');
    s = resetState();
    s.player.gold = 0; s.player.xp = 100;
    var pay = D.payShopCost(window.state, 20);
    assert(pay === 'xp', '金币不足时改用经验付款', pay);
    assert(window.state.player.xp === 80, '经验真的扣了（100 → 80）', window.state.player.xp);
    assert(window.state.player.gold === 0, '金币没被扣成负数', window.state.player.gold);
    var pay2 = D.payShopCost(window.state, 999);
    assert(pay2 === null, '两边都不够 → 买不了', pay2);
    s.player.gold = 30; s.player.xp = 100;
    var pay3 = D.payShopCost(window.state, 20);
    assert(pay3 === 'gold' && window.state.player.gold === 10 && window.state.player.xp === 100,
      '金币够时仍优先付金币', pay3 + ' · 金 ' + window.state.player.gold + ' / 经验 ' + window.state.player.xp);

    /* ================= 7. 批2 · 力量药水 ================= */
    section('7. 批2 · 力量药水（进战斗房自动喝）');
    A.setGodMode(true);
    s = resetState();
    s.player.strengthPotions = 1;
    D.pushStats(); await sleep(100);
    assert(heroDbg().strength === 1, 'debug / 引擎拿到 1 瓶力量药水', heroDbg().strength);
    scn.buildLevel({ type: 'enemy', col: 0, row: 1 });
    await sleep(200);
    assert(window.state.player.strengthPotions === 0, '进战斗房消耗 1 瓶（内核瓶数真的少 1）',
      window.state.player.strengthPotions);
    assert(scn._roomStrength === 1.25, '本房间伤害倍率 ×1.25', scn._roomStrength);
    assert(A.debug().hero.attack === window.state.player.attack, 'strength 消耗没有连带改攻击');

    section('7b. 非战斗房不喝');
    s.player.strengthPotions = 1; D.pushStats(); await sleep(80);
    scn.buildLevel({ type: 'shop', col: 0, row: 1 });
    await sleep(150);
    assert(window.state.player.strengthPotions === 1, '进商店房不消耗力量药水', window.state.player.strengthPotions);
    assert(scn._roomStrength === 1, '商店房没有伤害加成', scn._roomStrength);

    /* ================= 8. 批2 · 双倍金币 / 生命护盾 ================= */
    section('8. 批2 · 两个开局增益');
    s = resetState(); s.player.gold = 0;
    D.settleRoomGold('enemy');
    var goldNormal = s.player.gold;
    s = resetState(); s.hasDoubleGold = true; s.player.gold = 0;
    D.settleRoomGold('enemy');
    var goldDouble = s.player.gold;
    assert(goldDouble > goldNormal, '双倍金币：金币 ×1.5（' + goldNormal + ' → ' + goldDouble + '）');
    assert(goldDouble === Math.round(goldNormal * 1.5), '倍率精确 ×1.5');

    s = resetState(); s.hasLifeShield = true;
    var savedSkill = scn.skillId;
    scn.skillId = 'rogue';                 // 避开战士 / 守护者的开局护盾，单独验这一条
    D.pushStats(); await sleep(100);
    scn.hero.shield = 0;
    scn.buildLevel({ type: 'enemy', col: 0, row: 1 });
    await sleep(150);
    assert(heroDbg().shield === 2, '生命护盾：每房间开始 +2 护盾', heroDbg().shield);
    scn.skillId = savedSkill;

    /* ================= 9. 批3 · 遗物显示名 ================= */
    section('9. 批3 · 遗物名字（C 方案：日志写引擎显示名）');
    LOGS = [];
    s = resetState();
    var added = D.cheat.addRelic('heavyStrike');
    await sleep(80);
    var logText = LOGS.join('\n');
    assert(added, '拿到「重击」');
    assert(logText.indexOf('重击') >= 0, '日志写的是引擎显示名「重击」', logText);
    assert(logText.indexOf('战斗怒火') < 0, '日志里不再出现老名字「战斗怒火」');

    section('9b. 内核打日志用的翻译入口');
    assert(D.relicDisplayName('战斗怒火') === '重击', '战斗怒火 → 重击', D.relicDisplayName('战斗怒火'));
    assert(D.relicDisplayName('铁卫纹章') === '铁壁', '铁卫纹章 → 铁壁', D.relicDisplayName('铁卫纹章'));
    assert(D.relicDisplayName('回声之环') === '汲魂者', '回声之环 → 汲魂者', D.relicDisplayName('回声之环'));
    assert(D.relicDisplayName('神圣庇护') === '神圣庇护', '无映射的遗物保留原名（神圣庇护）', D.relicDisplayName('神圣庇护'));
    assert(D.relicDisplayName('猎人本能') === '猎人本能', '无映射的遗物保留原名（猎人本能）', D.relicDisplayName('猎人本能'));
    assert(D.relicDisplayName('不存在的东西') === '不存在的东西', '未知名字原样返回，不抛错');
    s.hero.id = 'ranger';   // 远程英雄：同一件遗物应换成远程那套名字
    assert(D.relicDisplayName('战斗怒火') === '坠星', '远程英雄下同一件遗物叫「坠星」', D.relicDisplayName('战斗怒火'));
    s.hero.id = 'warrior';

    section('9c. 图鉴「增益」与 BONUS_POOL 同源（内核侧）');
    var enc = null;
    try { enc = window.getEncyclopediaData ? window.getEncyclopediaData() : null; } catch (e) { enc = null; }
    if (enc && enc['增益']) {
      var bonusList = enc['增益'];
      assert(bonusList.length >= 28, '图鉴增益条目数 == 全量池（不再手抄 13 条）', bonusList.length);
      var life = bonusList.filter(function (b) { return b.title === '生命护盾'; })[0];
      assert(life && life.description.indexOf('每间战斗房') >= 0,
        '生命护盾描述已改成房间级语义', life ? life.description : '(缺失)');
    } else {
      log('  · 跳过（本页不加载 主程序.js 内核）', 'dim');
    }

    /* ================= 10. 批4 · 变化横幅 ================= */
    section('10. 批4 · 拿了看得见（快照对比 → 变化横幅）');
    s = resetState();
    D.pushStats(); await sleep(80);
    var shown = A.showGain([
      { key: 'attack', label: '攻击', from: 10, to: 11, color: '#ff8a7a' },
      { key: 'shield', label: '护盾', from: 0, to: 3, color: '#5fd0e0' }
    ]);
    await sleep(80);
    assert(shown === true, 'API.showGain 返回 true', shown);
    assert(!!scn._gainBanner, '横幅已建出');
    assert(scn._gainBanner && scn._gainBanner._gainLines.length === 2, '横幅两行',
      scn._gainBanner ? JSON.stringify(scn._gainBanner._gainLines) : null);
    assert(scn._gainBanner && scn._gainBanner._gainLines[0] === '攻击  10 → 11', '第一行文案是「攻击 10 → 11」',
      scn._gainBanner ? scn._gainBanner._gainLines[0] : null);

    var oldBanner = scn._gainBanner;
    A.showGain([{ key: 'attack', label: '攻击', from: 5, to: 5 }]);
    assert(scn._gainBanner === oldBanner, '无变化 → 不刷新横幅（不弹"什么都没发生"）');

    A.showGain([1, 2, 3, 4, 5, 6].map(function (n) { return { key: 'attack', label: '项' + n, from: 0, to: n }; }));
    await sleep(60);
    assert(scn._gainBanner._gainLines.length === 5, '最多 4 行 + 「等 N 项」', scn._gainBanner._gainLines.length);
    assert(/等 2 项/.test(scn._gainBanner._gainLines[4]), '超出部分合并成「等 N 项」', scn._gainBanner._gainLines[4]);

    section('10b. 快照对比（宿主侧）');
    var snap1 = D.snapshotStats(window.state);
    window.state.player.attack += 2;
    window.state.player.gold += 12;
    var diff = D.diffStats(snap1, D.snapshotStats(window.state));
    assert(diff.length === 2, 'diffStats 抓到两项变化', JSON.stringify(diff));
    assert(diff[0].label === '攻击' && diff[0].from === 10 && diff[0].to === 12, 'diff 带 from / to',
      JSON.stringify(diff[0]));
    assert(D.diffStats(snap1, snap1).length === 0, '同一份快照 diff 为空');

    section('10c. 选前预告（确定性奖励才做）');
    assert(D.rewardPreviewText('攻击 +1', window.state) === '攻击 12 → 13',
      '攻击 +1 → 「攻击 12 → 13」', D.rewardPreviewText('攻击 +1', window.state));
    assert(/^生命上限 \d+ → \d+$/.test(D.rewardPreviewText('生命上限 +4', window.state)),
      '生命上限 +4 → 「生命上限 N → N+4」', D.rewardPreviewText('生命上限 +4', window.state));
    assert(/^暴击 \d+% → \d+%$/.test(D.rewardPreviewText('暴击 +10%', window.state)),
      '暴击 +10% 带百分号', D.rewardPreviewText('暴击 +10%', window.state));
    assert(D.rewardPreviewText('力量药水', window.state) === '力量药水 2 → 3',
      '力量药水按瓶数预告', D.rewardPreviewText('力量药水', window.state));
    assert(D.rewardPreviewText('奇怪的东西', window.state) === '', '预告不了的返回空串');

    section('10d. withFeedback 包住入口（奖励）');
    s = resetState();
    D.pushStats(); await sleep(100);
    if (scn._gainBanner) { try { scn._gainBanner.destroy(true); } catch (e) {} scn._gainBanner = null; }
    s.rewardOptions = [{ label: '攻击 +1', apply: function () { window.state.player.attack += 1; } }];
    A.openRewardChoice({ title: '战斗奖励', cards: [{ id: '0', name: '攻击 +1', desc: '' }] });
    await sleep(60);
    A.closeChoicePanel({ kind: 'reward', id: '0' });
    await sleep(150);
    assert(heroDbg().attack === 11, '奖励入口：引擎攻击 10 → 11', heroDbg().attack);
    assert(!!scn._gainBanner && /攻击/.test(scn._gainBanner._gainLines[0]),
      '奖励入口自动弹横幅（不用给每个选项写文案）',
      scn._gainBanner ? scn._gainBanner._gainLines.join(' | ') : '无');

    /* ================= 11. 回归点 ================= */
    section('11. 回归：批1 之后既有行为不变');
    s = resetState(); D.pushStats(); await sleep(60);
    assert(heroDbg().attack === 10, '全量下发仍是幂等的');
    A.setGodMode(false);

    log('');
    log(fail === 0 ? ('全部通过：' + pass + ' 项') : ('失败 ' + fail + ' 项 / 通过 ' + pass + ' 项'),
      fail === 0 ? 'ok' : 'bad');
  }

  var running = false;
  async function start() {
    if (running) return; running = true;
    try { await run(); } catch (e) { log('异常：' + (e && e.stack || e), 'bad'); }
    running = false;
  }
  document.getElementById('rerun').addEventListener('click', function () { start(); });
  setTimeout(start, 300);
})();
</script>
</body>
</html>
