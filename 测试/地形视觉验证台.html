<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地形视觉验证台 · 深渊回廊 2.9.1</title>
<style>
  html, body { margin:0; height:100%; background:#05080f; overflow:hidden;
    font-family:"Microsoft YaHei", system-ui, sans-serif; }
  #stage { position:fixed; inset:0; }
  #bar { position:fixed; left:50%; top:8px; transform:translateX(-50%); z-index:20;
    display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:center;
    padding:7px 10px; border-radius:11px; background:rgba(9,14,26,.82);
    border:1px solid rgba(255,255,255,.13); backdrop-filter:blur(8px);
    font-size:12px; color:#c2d2ee; max-width:min(96vw, 760px); }
  body.hud-off #bar, body.hud-off #hint { display:none; }
  #bar .lbl { color:#7d8cad; letter-spacing:.06em; margin:0 2px 0 6px; }
  #bar button { padding:5px 11px; border-radius:7px; cursor:pointer; font:inherit;
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.05); color:#c8d6f0;
    transition:background .14s, border-color .14s, color .14s; }
  #bar button:hover { background:rgba(255,255,255,.11); }
  #bar button[aria-pressed="true"] { background:rgba(115,240,180,.14);
    border-color:rgba(115,240,180,.55); color:#8ff5c6; }
  #bar button.warn[aria-pressed="true"] { background:rgba(255,120,140,.16);
    border-color:rgba(255,120,140,.55); color:#ff9db0; }
  #bar .sep { width:1px; height:18px; background:rgba(255,255,255,.14); margin:0 4px; }
  #hint { position:fixed; left:50%; top:52px; transform:translateX(-50%); z-index:20;
    font-size:12px; color:#66799c; letter-spacing:.04em; pointer-events:none; }
  #bar .meta { flex:1 0 100%; text-align:center;
    padding-top:4px; margin-top:1px; border-top:1px solid rgba(255,255,255,.08);
    font-size:11px; color:#66799c; font-variant-numeric:tabular-nums; }
  #bar .meta b { color:#9fb4d8; font-weight:600; }
</style>
</head>
<body>
<div id="stage"></div>

<div id="bar">
  <span class="lbl">骨架</span>
  <button data-skel="flat"   aria-pressed="true">平厅</button>
  <button data-skel="double" aria-pressed="false">双层</button>
  <button data-skel="bridge" aria-pressed="false">断桥</button>
  <span class="sep"></span>
  <span class="lbl">塌陷</span>
  <button id="mech" class="warn" aria-pressed="false">关</button>
  <span class="sep"></span>
  <button id="annot" aria-pressed="false">标注</button>
  <button id="reroll">换一间</button>
  <div class="meta" id="meta"></div>
</div>

<script src="../vendor/phaser.min.js?v=20261025"></script>
<script src="../角色形象.js?v=20261025"></script>
<script src="../战斗2D.js?v=20261025"></script>
<script>
(function () {
  var A = null, scene = null, booting = false;
  var qs = new URLSearchParams(location.search);
  var skel = qs.get('skel') || 'flat';
  var mech = qs.get('mech') === 'collapse';
  var annotate = qs.get('annot') === '1';
  var uiOff = qs.get('ui') === '0';
  if (uiOff) document.body.classList.add('hud-off');
  var seed = Number(qs.get('seed') || 20261025);

  var elBar = document.getElementById('bar');
  var elMech = document.getElementById('mech');
  var elAnnot = document.getElementById('annot');
  var elReroll = document.getElementById('reroll');
  var elMeta = document.getElementById('meta');
  var notes = [];   // 标注文字对象（换房时清）

  function seeded(s) {
    var x = s >>> 0;
    return function () {
      x |= 0; x = (x + 0x6D2B79F5) | 0;
      var t = Math.imul(x ^ (x >>> 15), 1 | x);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function syncBar() {
    var btns = elBar.querySelectorAll('[data-skel]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', btns[i].dataset.skel === skel ? 'true' : 'false');
    }
    elMech.setAttribute('aria-pressed', mech ? 'true' : 'false');
    elMech.textContent = mech ? '开' : '关';
    elAnnot.setAttribute('aria-pressed', annotate ? 'true' : 'false');
    var u = new URL(location.href);
    u.searchParams.set('skel', skel);
    u.searchParams.set('mech', mech ? 'collapse' : 'none');
    u.searchParams.set('annot', annotate ? '1' : '0');
    u.searchParams.set('seed', String(seed));
    history.replaceState(null, '', u.toString());
  }

  function writeMeta() {
    if (!scene) { elMeta.innerHTML = ''; return; }
    var d = (A.debug && A.debug()) || {};
    var c = d.collapse || {};
    var tiles = (scene.platformTiles || []).length;
    var strips = (scene.platformStrips || []).length;
    var solid = (scene.platformTiles || []).filter(function (t) { return !!t._solidDeck; }).length;
    var skName = scene.roomSkeleton ||
      (typeof d.skeleton === 'string' ? d.skeleton : (d.skeleton && d.skeleton.skeleton)) || skel;
    elMeta.innerHTML =
      '<b>' + skName + '</b>' + (c.kind ? ' × 塌陷' : '') +
      ' · 实体 ' + solid + '/' + tiles + ' · 视觉 ' + strips + ' 段' +
      ' · 地面 ' + ((scene.groundSegments || []).length) + ' 段 / ' + Math.round(scene.levelWidth || 0);
  }

  function clearNotes() {
    notes.forEach(function (t) { if (t && t.destroy) t.destroy(); });
    notes = [];
  }

  /** 在两类平台的顶面写一行注解（截图用来证明"看得出区别"） */
  function addNotes() {
    clearNotes();
    if (!annotate || !scene) return;
    var d = 12;
    (scene.platformSpots || []).forEach(function (p) {
      var deck = !!p.deck;
      var t = scene.add.text(p.x0 + 6, p.y - 40, deck ? '实体楼板 · 不能穿' : '浮台 · 可穿',
        {
          fontFamily: 'Microsoft YaHei', fontSize: '12px',
          color: deck ? '#ffd2a0' : '#a8f0ff', fontStyle: 'bold'
        }).setOrigin(0, 1).setDepth(d);
      t.setShadow(0, 1, '#04060f', 4, false, true);
      notes.push(t);
    });
  }

  async function rebuild() {
    if (!scene) return;
    var old = Math.random;
    Math.random = seeded(seed);
    try {
      scene.floor = 10;
      if (scene.floorMap) scene.floorMap.floor = 10;
      scene._forceSkeleton = skel;
      scene.buildLevel({
        type: 'enemy', col: 1, row: 1,
        mechanic: mech ? 'collapse' : null,
        // 不塌陷时必须显式关掉机制抽签 —— 否则 pickMechanic 会按 15% 抽到 collapse，
        // 而塌陷房是"无浮台"的，看到的就是空房间（第一次搭这个验证台就踩了）
        noMechanics: !mech,
        _mechCounted: true
      });
    } finally {
      Math.random = old;
      scene._forceSkeleton = null;
    }
    await sleep(60);
    // 站到房间中段：一次看得到地面 + 上层（相机跟随，不用手调）
    if (scene.hero && scene.hero.body) {
      scene.hero.body.reset(Math.round((scene.levelWidth || 1400) * 0.46), scene.groundY - 90);
    }
    await sleep(120);
    writeMeta();
    addNotes();
  }

  async function boot() {
    if (booting) return;
    booting = true;
    A = window.战斗2D;
    if (!A) { elMeta.textContent = '引擎未加载'; booting = false; return; }
    var d0 = A.debug();
    if (!d0.ready) {
      if (!d0.booted) {
        try { var ok = A.init(document.getElementById('stage'), true); if (ok) A.show(); }
        catch (e) { elMeta.textContent = 'init 异常：' + e; booting = false; return; }
      }
      booting = false;
      setTimeout(boot, 140);
      return;
    }
    scene = A.getGame().scene.getScene('TrialBattle');
    A.setGodMode(true);
    A.setFloorPlan({ rooms: ['enemy', 'enemy', 'enemy', 'enemy', 'boss'] });
    A.startRun({
      heroName: '地形', points: 0,
      player: { maxHp: 500, hp: 500, attack: 12, dodge: 0 },
      difficulty: 'normal', heroId: 'warrior', skill: { id: 'warrior' },
      curses: [], environment: null
    });
    await sleep(1500);   // 等开局的「深渊回廊 · 第 N 层」标题动画放完，否则截图会压在画面上
    booting = false;
    rebuild();
  }

  elBar.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.skel) { skel = b.dataset.skel; syncBar(); rebuild(); return; }
    if (b === elMech) { mech = !mech; syncBar(); rebuild(); return; }
    if (b === elAnnot) { annotate = !annotate; syncBar(); addNotes(); return; }
    if (b === elReroll) { seed = (seed * 1103515245 + 12345) >>> 0; syncBar(); rebuild(); return; }
  });

  syncBar();
  boot();
})();
</script>
</body>
</html>
