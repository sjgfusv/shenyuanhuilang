<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏素材总览 · 深渊回廊</title>
<style>
  :root {
    --bg: #070a12;
    --panel: #111726;
    --panel-2: #0d1320;
    --line: rgba(255, 255, 255, 0.07);
    --line-2: rgba(255, 255, 255, 0.13);
    --text: #eef3ff;
    --sub: #a8bce0;
    --muted: #6a7fa0;
    --gold: #f0d06a;
    --accent: #5fd0e0;
    --good: #73f0b4;
    --danger: #e86878;
    --z: 3;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; padding: 0 0 80px;
    background: radial-gradient(circle at 50% -10%, #111a33 0%, var(--bg) 58%) fixed;
    color: var(--text);
    font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    font-size: 13px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  /* ---------- 页头 ---------- */
  .top {
    max-width: 1500px; margin: 0 auto; padding: 34px 28px 18px;
  }
  .top h1 {
    margin: 0 0 6px; font-size: 27px; letter-spacing: 3px; color: var(--gold);
  }
  .top h1 em {
    font-style: normal; font-size: 12px; letter-spacing: 1px; color: var(--muted);
    margin-left: 12px; vertical-align: 4px;
  }
  .lede { margin: 0; color: var(--sub); max-width: 900px; }
  .lede b { color: var(--text); font-weight: 600; }

  .toolbar {
    margin-top: 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  .stat {
    display: flex; gap: 16px; flex-wrap: wrap;
    padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: rgba(17, 23, 38, 0.66);
  }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat b { color: var(--gold); font-size: 14px; margin-right: 3px; font-variant-numeric: tabular-nums; }

  .search {
    flex: 1 1 220px; min-width: 180px; max-width: 300px;
    background: rgba(10, 14, 24, 0.9); border: 1px solid var(--line);
    border-radius: 10px; color: var(--text); font: inherit; padding: 8px 12px; outline: none;
  }
  .search:focus { border-color: rgba(95, 208, 224, 0.55); box-shadow: 0 0 0 3px rgba(95, 208, 224, 0.08); }
  .search::placeholder { color: #4d5f7d; }

  .zoom { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: rgba(17,23,38,.66); }
  .zoom button {
    font: inherit; font-size: 12px; color: var(--sub); background: transparent;
    border: 0; border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .zoom button.on { background: rgba(95, 208, 224, 0.16); color: var(--accent); }
  .zoom button:hover { color: var(--text); }

  /* ---------- 两栏 ---------- */
  .shell {
    max-width: 1500px; margin: 0 auto; padding: 0 28px;
    display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 30px;
    align-items: start;
  }
  .toc {
    position: sticky; top: 18px; max-height: calc(100vh - 36px); overflow: auto;
    padding: 12px 10px; border: 1px solid var(--line); border-radius: 12px;
    background: rgba(13, 19, 32, 0.72);
  }
  .toc-title { font-size: 11px; letter-spacing: 2px; color: var(--muted); padding: 2px 8px 8px; }
  .toc-item {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 8px; color: var(--sub); font-size: 12.5px;
    border-left: 2px solid transparent;
  }
  .toc-item:hover { background: rgba(255, 255, 255, 0.04); color: var(--text); }
  .toc-item.on { background: rgba(95, 208, 224, 0.10); color: var(--accent); border-left-color: var(--accent); }
  .toc-item i { font-style: normal; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .toc-item.on i { color: var(--accent); }

  /* ---------- 分类 ---------- */
  .sec { margin-bottom: 42px; scroll-margin-top: 16px; }
  .sec.empty { display: none; }
  .sec-head { margin-bottom: 14px; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
  .sec-head h2 {
    margin: 0; font-size: 17px; letter-spacing: 1.5px; font-weight: 700;
    display: flex; align-items: baseline; gap: 10px;
  }
  .sec-head h2::before {
    content: ""; width: 3px; height: 15px; border-radius: 2px;
    background: linear-gradient(180deg, var(--gold), rgba(240, 208, 106, 0.15));
    align-self: center;
  }
  .cnt { font-size: 11.5px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .sec-desc { margin: 5px 0 0 13px; color: var(--muted); font-size: 12.5px; }

  /* ---------- 卡片网格 ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: 12px; }
  .grid.wide { grid-template-columns: repeat(auto-fill, minmax(186px, 1fr)); }
  .subhead {
    grid-column: 1 / -1; margin: 8px 0 -2px; font-size: 12px; letter-spacing: 1px;
    color: var(--sub); display: flex; align-items: center; gap: 8px;
  }
  .subhead::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .subhead b { font-weight: 600; }
  .subhead span { color: var(--muted); font-size: 11px; }

  .card {
    background: linear-gradient(180deg, #131a2b 0%, #0f1524 100%);
    border: 1px solid var(--line); border-radius: 12px; padding: 9px;
    display: flex; flex-direction: column; gap: 7px;
    transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
  }
  .card:hover {
    border-color: rgba(95, 208, 224, 0.42);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
  }
  .thumb {
    height: 106px; border-radius: 8px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background-color: #090d16;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,.024) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.024) 75%),
      linear-gradient(45deg, rgba(255,255,255,.024) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.024) 75%);
    background-size: 12px 12px;
    background-position: 0 0, 6px 6px;
  }
  .thumb.tall { height: 158px; }
  /* 像素贴图卡的高度跟随缩放档位，放大时才真的看得见 */
  .thumb.pixbox { height: calc(30px + var(--z) * 34px); }
  .thumb.pixbox.tall { height: calc(58px + var(--z) * 30px); }
  .thumb img { display: block; max-width: 100%; max-height: 100%; }
  canvas.pix {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    width: calc(var(--w) * 1px * var(--z));
    max-width: 100%; max-height: 100%; height: auto;
  }
  canvas.smooth { display: block; max-width: 100%; max-height: 100%; }

  .cap { min-width: 0; }
  .name { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .id {
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 10.5px; color: var(--muted); word-break: break-all; margin-top: 1px;
  }
  .note { font-size: 11px; color: var(--sub); line-height: 1.45; margin-top: 3px; }
  .note.clamp {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .q { font-size: 10px; padding: 0 5px; border-radius: 4px; border: 1px solid currentColor; margin-left: 4px; }

  /* ---------- 角色行 ---------- */
  .rows { display: flex; flex-direction: column; gap: 9px; }
  .row {
    padding: 10px 13px; border: 1px solid var(--line); border-radius: 12px;
    background: linear-gradient(90deg, rgba(19, 26, 43, 0.95), rgba(15, 21, 36, 0.75));
    display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 16px; align-items: center;
  }
  .row:hover { border-color: rgba(95, 208, 224, 0.34); }
  .who { min-width: 0; }
  .who .name { font-size: 14px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .who .name i { font-style: normal; font-size: 11px; color: var(--muted); font-weight: 400; }
  .who .meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .swatch {
    display: inline-block; width: 9px; height: 9px; border-radius: 2px;
    margin-right: 4px; vertical-align: -1px; border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .frames { overflow: hidden; border-radius: 8px; }
  .frames canvas {
    display: block; width: auto; max-width: 100%; height: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }

  /* ---------- 色板 ---------- */
  .sw {
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    background: var(--panel-2);
  }
  .sw .chip { height: 52px; }
  .sw .info { padding: 7px 9px 9px; }
  .sw .info b { display: block; font-size: 12px; font-weight: 600; }
  .sw .info code { font-size: 10.5px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .sw .info span { display: block; font-size: 10.5px; color: var(--sub); margin-top: 2px; line-height: 1.4; }

  /* ---------- 页脚 ---------- */
  .foot {
    max-width: 1500px; margin: 10px auto 0; padding: 18px 28px 0;
    border-top: 1px solid var(--line); color: var(--muted); font-size: 12px;
  }
  .foot code { color: var(--accent); font-family: ui-monospace, Consolas, monospace; }
  .foot p { margin: 0 0 5px; }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; padding: 0 16px; }
    .toc { position: static; max-height: none; display: flex; flex-wrap: wrap; gap: 4px; }
    .toc-title { width: 100%; }
    .toc-item { border-left: 0; border: 1px solid var(--line); }
    .top { padding: 24px 16px 14px; }
    .row { grid-template-columns: 1fr; }
    .foot { padding: 18px 16px 0; }
  }
</style>
</head>
<body>

<header class="top">
  <h1>游戏素材总览<em>深渊回廊 · 素材展示页</em></h1>
  <p class="lede">
    游戏内<strong>全部美术素材</strong>按类别集中在这一页：角色形象、弹药、遗物、界面图标、地形与机制美术、
    特效、状态条、品牌图标、徽章与色板。<strong>除 logo 与 README 徽章外，其余全部由代码绘制</strong>，
    没有任何外部图片文件 —— 这里展示的就是运行时画出来的那一份。
  </p>
  <div class="toolbar">
    <div class="stat">
      <span><b id="s-cat">0</b>个分类</span>
      <span><b id="s-item">0</b>件素材</span>
      <span><b id="s-file">19</b>件为文件素材</span>
    </div>
    <input class="search" id="q" type="search" placeholder="搜索素材名 / id …" autocomplete="off">
    <div class="zoom" id="zoom">
      <button data-z="1">1×</button>
      <button data-z="2">2×</button>
      <button data-z="3" class="on">3×</button>
      <button data-z="4">4×</button>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="toc">
    <div class="toc-title">素材分类</div>
    <div id="toc"></div>
  </aside>
  <main id="main"></main>
</div>

<footer class="foot">
  <p>素材来源：<code>角色形象.js</code>（角色与弹药）、<code>战斗2D.js</code>（地形 / 核心 / 护罩 / 遗物 / 图标 / 状态条）、<code>badges/*.svg</code>、<code>logo/*</code>。</p>
  <p>本页为只读整理页：只读取与重绘，不参与游戏运行，也不修改任何游戏文件。</p>
</footer>

<script src="../角色形象.js"></script>
<script>
(function () {
  'use strict';

  var A = window.角色形象;
  var MAIN = document.getElementById('main');
  var TOC = document.getElementById('toc');
  var SECTIONS = [];

  /* ============================================================
     基础工具
     ============================================================ */
  function cv(w, h) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }
  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function hex6(n) { return '#' + ('000000' + ((n | 0) >>> 0).toString(16)).slice(-6); }
  function hexToRgba(h, a) {
    var n = parseInt(h.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function cssColor(c, a) {
    if (typeof c === 'string') return c;
    var n = (c | 0) >>> 0;
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + (a == null ? 1 : a) + ')';
  }
  function pathRoundRect(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  /** Phaser Graphics 的 Canvas2D 替身：只为把绘制指令原样光栅化 */
  function Gfx(canvas) {
    var ctx = canvas.getContext('2d');
    var ls = { w: 1, c: 0xffffff, a: 1 };
    var fs = { c: 0xffffff, a: 1 };
    var path = [];
    var api = {
      ctx: ctx,
      lineStyle: function (w, c, a) { ls = { w: w, c: c, a: a == null ? 1 : a }; return api; },
      fillStyle: function (c, a) { fs = { c: c, a: a == null ? 1 : a }; return api; },
      beginPath: function () { path = []; return api; },
      moveTo: function (x, y) { path.push(['m', x, y]); return api; },
      lineTo: function (x, y) { path.push(['l', x, y]); return api; },
      closePath: function () { path.push(['c']); return api; },
      arc: function (x, y, r, a0, a1, acw) { path.push(['a', x, y, r, a0, a1, !!acw]); return api; },
      strokePath: function () {
        ctx.strokeStyle = cssColor(ls.c, ls.a);
        ctx.lineWidth = ls.w;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        for (var i = 0; i < path.length; i++) {
          var p = path[i];
          if (p[0] === 'm') ctx.moveTo(p[1], p[2]);
          else if (p[0] === 'l') ctx.lineTo(p[1], p[2]);
          else if (p[0] === 'c') ctx.closePath();
          else if (p[0] === 'a') ctx.arc(p[1], p[2], p[3], p[4], p[5], p[6]);
        }
        ctx.stroke();
        return api;
      },
      fillRect: function (x, y, w, h) { ctx.fillStyle = cssColor(fs.c, fs.a); ctx.fillRect(x, y, w, h); return api; },
      fillRoundedRect: function (x, y, w, h, r) { ctx.fillStyle = cssColor(fs.c, fs.a); pathRoundRect(ctx, x, y, w, h, r); ctx.fill(); return api; },
      strokeRoundedRect: function (x, y, w, h, r) { ctx.strokeStyle = cssColor(ls.c, ls.a); ctx.lineWidth = ls.w; pathRoundRect(ctx, x, y, w, h, r); ctx.stroke(); return api; },
      fillCircle: function (x, y, r) { ctx.fillStyle = cssColor(fs.c, fs.a); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); return api; },
      strokeCircle: function (x, y, r) { ctx.strokeStyle = cssColor(ls.c, ls.a); ctx.lineWidth = ls.w; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); return api; },
      fillTriangle: function (x1, y1, x2, y2, x3, y3) {
        ctx.fillStyle = cssColor(fs.c, fs.a);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath(); ctx.fill();
        return api;
      },
      fillEllipse: function (x, y, w, h) { ctx.fillStyle = cssColor(fs.c, fs.a); ctx.beginPath(); ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2); ctx.fill(); return api; },
      strokeEllipse: function (x, y, w, h) { ctx.strokeStyle = cssColor(ls.c, ls.a); ctx.lineWidth = ls.w; ctx.beginPath(); ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2); ctx.stroke(); return api; }
    };
    return api;
  }

  /* ============================================================
     分类骨架
     ============================================================ */
  function section(id, title, desc, bodyClass) {
    var s = el('section', 'sec');
    s.id = id;
    var head = el('div', 'sec-head');
    head.appendChild(el('h2', null, title + '<span class="cnt" data-cnt></span>'));
    head.appendChild(el('p', 'sec-desc', desc));
    s.appendChild(head);
    var body = el('div', bodyClass || 'grid');
    s.appendChild(body);
    MAIN.appendChild(s);

    var rec = { id: id, title: title, el: s, body: body, count: 0 };
    SECTIONS.push(rec);

    var link = el('a', 'toc-item', '<b>' + title + '</b><i data-cnt></i>');
    link.href = '#' + id;
    TOC.appendChild(link);
    rec.link = link;
    return rec;
  }

  function card(rec, spec) {
    var c = el('div', 'card');
    c.dataset.s = ((spec.name || '') + ' ' + (spec.id || '') + ' ' + (spec.note || '')).toLowerCase();

    var isPix = !!(spec.node && spec.node.classList && spec.node.classList.contains('pix'));
    var th = el('div', 'thumb' + (spec.tall ? ' tall' : '') + (isPix ? ' pixbox' : ''));
    if (spec.node) th.appendChild(spec.node);
    c.appendChild(th);

    var cap = el('div', 'cap');
    cap.appendChild(el('div', 'name', spec.name + (spec.tag || '')));
    if (spec.id) cap.appendChild(el('div', 'id', spec.id));
    if (spec.note) cap.appendChild(el('div', 'note' + (spec.clamp ? ' clamp' : ''), spec.note));
    c.appendChild(cap);

    rec.body.appendChild(c);
    rec.count++;
    return c;
  }

  function subhead(rec, title, sub) {
    rec.body.appendChild(el('div', 'subhead', '<b>' + title + '</b>' + (sub ? '<span>' + sub + '</span>' : '')));
  }

  /* ============================================================
     1 · 角色形象（来自 角色形象.js）
     ============================================================ */
  var HEAD_NAME = {
    helm: '全罩盔', greathelm: '桶盔', wingHelm: '翼盔', hood: '兜帽', facelessHood: '无面兜帽',
    featherCap: '羽帽', pointedHat: '尖顶帽', sageCap: '智者帽', bare: '无盔', skull: '骷髅',
    rot: '腐面', molten: '熔岩头', beast: '兽头', wisp: '影雾', hornedCrown: '角冠',
    crownAntlers: '鹿角冠', necroMask: '骨面兜帽', mirror: '镜像兜帽'
  };
  var WEAPON_NAME = {
    sword: '长剑', glowSword: '圣光剑', greatsword: '巨剑', dagger: '匕首', axe: '战斧', bow: '长弓',
    staff: '法杖', scythe: '长镰', spear: '长矛', halberd: '重戟', claws: '双爪', fist: '熔岩拳',
    arm: '前伸手臂', mirror: '镜像武器', roundShield: '圆盾', towerShield: '塔盾'
  };
  var LEGS_NAME = { legs: '双腿', robe: '长袍', wisp: '影雾', lava: '熔岩底座', beast: '四足', bones: '骨腿' };
  var EXTRA_NAME = {
    cape: '披风', plume: '顶羽', quiver: '箭袋', orb: '宝珠', scroll: '卷轴', halo: '光环', aura: '暗影光晕',
    cracks: '裂缝发光', spines: '背刺', tails: '影尾', ribs: '肋骨', tatter: '破布', fur: '毛皮',
    scars: '战痕', outline: '紫描边', cloakShort: '短披风', ghostOrbs: '幽魂光点', runeTrim: '符文镶边',
    scarf: '围巾'
  };
  var FRAME_LABEL = {
    hero: ['待机', '呼吸', '跑1', '跑2', '跑3', '跑4', '起跳', '下落', '挥砍1', '挥砍2', '收招', '受击', '倒地', '翻滚', '举盾'],
    mob: ['走1', '走2', '起手', '扑击', '受击', '死亡1', '死亡2']
  };

  function charRow(rec, id) {
    var look = A.LOOKS[id];
    if (id === 'mimic') {
      var src = A.LOOKS.warrior;
      look = {
        kind: 'mob', className: '镜像怪 · 照玩家造型（示例：战士）', build: src.build,
        colors: A.LOOKS.mimic.colors, head: src.head, weapon: src.weapon, offhand: src.offhand,
        legs: src.legs, extras: (src.extras || []).concat(['outline']), animRate: A.LOOKS.mimic.animRate
      };
    }
    var isHero = look.kind === 'hero';
    var n = A.framesOf(look);
    var c = look.colors, b = look.build;

    var wrap = el('div', 'row');
    var gear = [];
    if (look.head) gear.push(HEAD_NAME[look.head] || look.head);
    if (look.weapon) gear.push(WEAPON_NAME[look.weapon] || look.weapon);

    var lw = 1.7;
    var api = {
      w: function (n) { lw = (n == null ? 1.7 : n); g.lineStyle(lw, 0xffffff, 1); return api; },
      move: function (x, y) { g.beginPath(); g.moveTo(8 + x, 8 + y); return api; },
      line: function (x, y) { g.lineTo(8 + x, 8 + y); g.strokePath(); return api; },
      poly: function (pts, close) {
        g.beginPath();
        for (var i = 0; i < pts.length; i++) {
          if (i === 0) g.moveTo(8 + pts[i][0], 8 + pts[i][1]);
          else g.lineTo(8 + pts[i][0], 8 + pts[i][1]);
        }
        if (close) g.closePath();
        g.strokePath();
        return api;
      },
      ring: function (r, a0, a1) { g.beginPath(); g.arc(8, 8, r, a0, a1, false); g.strokePath(); return api; },
      dot: function (x, y, r) {
        g.fillStyle(0xffffff, 1);
        g.fillCircle(8 + x, 8 + y, r == null ? 1.2 : r);
        g.lineStyle(lw, 0xffffff, 1);
        return api;
      },
      tri: function (x1, y1, x2, y2, x3, y3) {
        g.fillStyle(0xffffff, 1);
        g.fillTriangle(8 + x1, 8 + y1, 8 + x2, 8 + y2, 8 + x3, 8 + y3);
        g.lineStyle(lw, 0xffffff, 1);
        return api;
      }
    };
    return api;
  }

  function barCanvas(w, h, from, to) {
    var c = cv(w, h);
    var ctx = c.getContext('2d');
    var g = ctx.createLinearGradient(0, 0, w, 0);
    g.addColorStop(0, from); g.addColorStop(1, to);
    pathRoundRect(ctx, 0, 0, w, h, h / 2);
    ctx.fillStyle = g; ctx.fill();
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fillRect(0, 0, w, Math.max(1, Math.round(h * 0.2)));
    ctx.globalCompositeOperation = 'source-over';
    return c;
  }
  function trackCanvas(w, h, tint) {
    var c = cv(w, h);
    var ctx = c.getContext('2d');
    var r = Math.min(h / 2, w / 2);
    pathRoundRect(ctx, 0, 0, w, h, r);
    ctx.fillStyle = 'rgba(5,7,15,0.62)'; ctx.fill();
    pathRoundRect(ctx, 0, 0, w, h, r);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
    pathRoundRect(ctx, 0.5, 0.5, w - 1, h - 1, Math.max(0.5, r - 0.5));
    ctx.strokeStyle = hexToRgba(tint, 0.14);
    ctx.lineWidth = 1;
    ctx.stroke();
    return c;
  }
  function glowCanvas(size) {
    var c = cv(size, size);
    var ctx = c.getContext('2d');
    var g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    g.addColorStop(0, 'rgba(255,255,255,0.85)');
    g.addColorStop(0.45, 'rgba(255,255,255,0.26)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    return c;
  }

    ['../logo/logo-minimal.png', 'logo-minimal.png', '512×512 · 极简构图'],
    ['../logo/logo-eye.png', 'logo-eye.png', '512×512 · 眼形构图'],
    ['../logo/logo-simple.png', 'logo-simple.png', '512×512 · 简化稿'],
    ['../logo/logo-clear.png', 'logo-clear.png', '512×512 · 定稿']
  ].forEach(function (it) {
    var img = document.createElement('img');
    img.src = it[0];
    img.alt = it[1];
    img.style.maxWidth = '100%';
    img.style.maxHeight = '100%';
    card(secBrand, { name: it[1], id: it[0].replace('../', ''), note: it[2], node: img });
  });

  /* ============================================================
     9 · README 徽章
     ============================================================ */
  var secBadges = section('badges', 'README 徽章',
    '仓库自带的 SVG 徽章，中文 / 英文各一套，不依赖任何外网服务；标签底色与强调色取自游戏色板。', 'grid wide');

  var BADGES = [
    { name: '版本', zh: 'version', en: 'version' },
    { name: '引擎', zh: 'phaser', en: 'engine' },
    { name: '零构建', zh: 'no-build', en: 'build' },
    { name: 'PWA', zh: 'pwa', en: 'pwa' },
    { name: '平台', zh: 'platform', en: 'platform' }
  ];
  BADGES.forEach(function (b) {
    [['zh', b.zh, ''], ['en', b.en, 'en/']].forEach(function (v) {
      var img = document.createElement('img');
      img.src = '../badges/' + v[2] + v[1] + '.svg';
      img.alt = b.name;
      img.style.width = '100%';
      img.style.maxWidth = '200px';
      card(secBadges, {
        name: b.name,
        id: 'badges/' + v[2] + v[1] + '.svg',
        note: v[0] === 'en' ? '英文版' : '中文版',
        node: img
      });
    });
  });

  /* ============================================================
     10 · 色板
     ============================================================ */
  var secPal = section('palette', '色板',
    '游戏视觉语言的取色来源：语义色、状态条渐变、遗物流派、品质、敌人层级、环境主题与材质。');
  secPal.noCount = true;

  var PALETTE = [
    {
      title: '语义色', sub: 'UI 常量，与画面内文字 / 按钮同源',
      items: [
        ['标题金', '#f0d06a', '标题、遗物名、强调数值'],
        ['正文白', '#f0f4ff', '正文与主数值'],
        ['次级蓝灰', '#a8bce0', '说明文字'],
        ['弱化灰蓝', '#6a7fa0', '注释、id、单位'],
        ['青（强调）', '#5fd0e0', '玩家的东西：护罩 / 读数 / 提醒'],
        ['绿（正向）', '#73f0b4', '回复、增益、可交互'],
        ['红（危险）', '#e86878', '受伤、敌方、破坏'],
        ['紫（奥术）', '#9a8ef0', '法师 / 连携 / 图鉴']
      ]
    },
    {
      title: '遗物流派', sub: '26 件遗物的色环色，同一件遗物只认一个色',
      items: [
        ['血怒', '#ff5a7a', '残血换输出 · 6 件'],
        ['完美', '#f0d06a', '判定窗口与判定收益 · 5 件'],
        ['连携', '#73f0b4', '攒 → 选 → 险 · 5 件'],
        ['贪婪', '#b07ae0', '收益换风险 · 3 件'],
        ['通用', '#8f97ad', '不参与成套 · 7 件']
      ]
    },
    {
      title: '品质与层级', sub: '遗物品质 / 敌人层级',
      items: [
        ['普通', '#9aa0b0', '遗物 · 普通'],
        ['稀有', '#4a8ad0', '遗物 · 稀有'],
        ['传说', '#d4a02a', '遗物 · 传说'],
        ['普通敌人', '#e8909c', '层级 · normal'],
        ['精英', '#7ab8ff', '层级 · elite'],
        ['镜像', '#c79aff', '层级 · mirror'],
        ['首领', '#ff8a7a', '层级 · boss']
      ]
    },
    {
      title: '环境主题', sub: '按难度换的星空 / 雾 / 地面色',
      items: [
        ['简单 · 雾', '#2a4a6a', '雾 alpha 0.16 · 地面 #2a3446'],
        ['普通 · 雾', '#4a1a3a', '雾 alpha 0.22 · 地面 #2e2a40'],
        ['困难 · 雾', '#5a2410', '雾 alpha 0.26 · 地面 #3a2a2a'],
        ['地狱 · 雾', '#6a0a08', '雾 alpha 0.32 · 地面 #40201a']
      ]
    },
    {
      title: '材质', sub: '地形与机制美术的固定几支颜色',
      items: [
        ['木质', '#55392d', '楼板 / 残板 / 断木梁'],
        ['木暗部', '#4a3128', '砖缝与第二层木板'],
        ['石座', '#1d1a16', '核心石座'],
        ['深渊黑', '#04030a', '断口底部 / 遮罩'],
        ['暖金预警', '#ffd76a', '危险预警（与限时同色）'],
        ['暗紫核心', '#6c5bd0', '被守护的核心本体'],
        ['地面紫', '#2a2135', '地面块主色']
      ]
    }
  ];

  PALETTE.forEach(function (grp) {
    subhead(secPal, grp.title, grp.sub);
    grp.items.forEach(function (it) {
      var box = el('div', 'sw');
      box.dataset.s = (grp.title + ' ' + it[0] + ' ' + it[1] + ' ' + it[2]).toLowerCase();
      var chip = el('div', 'chip');
      chip.style.background = it[1];
      box.appendChild(chip);
      box.appendChild(el('div', 'info', '<b>' + it[0] + '</b><code>' + it[1] + '</code><span>' + it[2] + '</span>'));
      secPal.body.appendChild(box);
      secPal.count++;
    });
  });

  /* ============================================================
     收尾：计数 / 目录 / 搜索 / 缩放 / 滚动高亮
     ============================================================ */
  var TOTAL = 0;
  SECTIONS.forEach(function (rec) {
    var cntEl = rec.el.querySelector('.cnt');
    if (cntEl) cntEl.textContent = rec.count + (rec.noCount ? ' 色' : ' 项');
    var descEl = rec.el.querySelector('.sec-desc');
    if (descEl && descEl.innerHTML.indexOf('%n%') >= 0) {
      descEl.innerHTML = descEl.innerHTML.replace(/%n%/g, rec.count);
    }
    rec.link.querySelector('i').textContent = rec.count;
    if (!rec.noCount) TOTAL += rec.count;
  });
  document.getElementById('s-cat').textContent = SECTIONS.length;
  document.getElementById('s-item').textContent = TOTAL;

  var qEl = document.getElementById('q');
  qEl.addEventListener('input', function () {
    var q = this.value.trim().toLowerCase();
    SECTIONS.forEach(function (rec) {
      var nodes = rec.body.querySelectorAll('.card, .row, .sw');
      var vis = 0;
      for (var i = 0; i < nodes.length; i++) {
        var hit = !q || (nodes[i].dataset.s || '').indexOf(q) >= 0;
        nodes[i].style.display = hit ? '' : 'none';
        if (hit) vis++;
      }
      var subs = rec.body.querySelectorAll('.subhead');
      for (var j = 0; j < subs.length; j++) subs[j].style.display = q ? 'none' : '';
      rec.el.classList.toggle('empty', vis === 0);
      rec.link.style.display = (q && vis === 0) ? 'none' : '';
    });
  });

  var zoomEl = document.getElementById('zoom');
  zoomEl.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var z = b.getAttribute('data-z');
    document.documentElement.style.setProperty('--z', z);
    Array.prototype.forEach.call(zoomEl.children, function (n) { n.classList.remove('on'); });
    b.classList.add('on');
  });

  var links = {};
  SECTIONS.forEach(function (rec) { links[rec.id] = rec.link; });
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        Object.keys(links).forEach(function (k) { links[k].classList.remove('on'); });
        if (links[en.target.id]) links[en.target.id].classList.add('on');
      });
    }, { rootMargin: '-15% 0px -70% 0px' });
    SECTIONS.forEach(function (rec) { io.observe(rec.el); });
  }
})();
</script>
</body>
</html>
